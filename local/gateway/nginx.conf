# Generated by scripts/sync-gateway.mjs from shared/service-routes.json — do not edit.
# Edit shared/service-routes.json, then run `node scripts/sync-gateway.mjs`.
#
# Local stand-in for the ALB path rules (docs/auth-users-split.md, 13.1). Regex locations
# are tried in order, so the rules keep their ALB priority order.
server {
    listen 8080;

    # Docker's DNS, looked up per request: a service that isn't running gets 502, not a
    # gateway that refuses to start.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Voice uploads are up to 10 MB (POST /api/v1/speech/transcriptions).
    client_max_body_size 12m;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;

    location = /gateway/health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 10 onboarding: /api/v1/children/*/onboarding*
    location ~ ^/api/v1/children/.*/onboarding.*$ {
        set $upstream onboarding;
        proxy_pass http://$upstream:8000;
    }

    # 20 discover: /api/v1/children/*/personality*
    location ~ ^/api/v1/children/.*/personality.*$ {
        set $upstream discover;
        proxy_pass http://$upstream:8000;
    }

    # 30 grow: /api/v1/children/*/growth-areas*
    location ~ ^/api/v1/children/.*/growth-areas.*$ {
        set $upstream grow;
        proxy_pass http://$upstream:8000;
    }

    # 40 transform: /api/v1/children/*/transform*
    location ~ ^/api/v1/children/.*/transform.*$ {
        set $upstream transform;
        proxy_pass http://$upstream:8000;
    }

    # 50 release: /api/v1/children/*/observations*
    location ~ ^/api/v1/children/.*/observations.*$ {
        set $upstream release;
        proxy_pass http://$upstream:8000;
    }

    # 60 connect: not built yet, so not routed (/api/v1/children/*/connect*).

    # 100 children: /api/v1/children
    location ~ ^/api/v1/children$ {
        set $upstream children;
        proxy_pass http://$upstream:8000;
    }
    # 100 children: /api/v1/children/*
    location ~ ^/api/v1/children/.*$ {
        set $upstream children;
        proxy_pass http://$upstream:8000;
    }

    # 110 users: /api/v1/users/*
    location ~ ^/api/v1/users/.*$ {
        set $upstream users;
        proxy_pass http://$upstream:8000;
    }

    # 120 auth: /api/v1/auth/*
    location ~ ^/api/v1/auth/.*$ {
        set $upstream auth;
        proxy_pass http://$upstream:8000;
    }

    # 130 shared: /api/v1/speech/*
    location ~ ^/api/v1/speech/.*$ {
        set $upstream shared;
        proxy_pass http://$upstream:8000;
    }
    # 130 shared: /api/v1/downloads/*
    location ~ ^/api/v1/downloads/.*$ {
        set $upstream shared;
        proxy_pass http://$upstream:8000;
    }

    # 140 shared: /api/health
    location ~ ^/api/health$ {
        set $upstream shared;
        proxy_pass http://$upstream:8000;
    }

    # Until build plan 8.6: anything else under /api/ goes to today's backend.
    location /api/ {
        set $upstream backend;
        proxy_pass http://$upstream:8000;
    }

    # The ALB's fixed 404 (priority 50000).
    location / {
        return 404;
    }
}
