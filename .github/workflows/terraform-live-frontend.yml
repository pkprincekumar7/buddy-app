name: Terraform Live Frontend
run-name: Terraform Live Frontend (${{ inputs.action }}, ${{ inputs.environment }})

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action: plan, apply, plan-destroy, destroy"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
          - plan-destroy
          - destroy
      environment:
        description: "Deployment environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - sbx
          - stg
          - prod
  workflow_call:
    inputs:
      action:
        type: string
        required: true
      environment:
        type: string
        required: true

permissions:
  id-token: write
  contents: read
  actions: read # the validate job lists this commit's runs: prod applies only what stg applied

concurrency:
  group: terraform-live-frontend-superpower-${{ inputs.environment }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  TF_VERSION: "1.16.4"
  TF_VAR_environment: ${{ inputs.environment }}
  # No TF_VAR_aws_region — the module has no aws_region variable.
  # All resources are hardcoded to us-east-1 (S3 bucket policy, SSM reads).

jobs:
  # -------------------------------------------------------------------------
  # Checks the inputs first, before any environment's secrets are loaded
  # (SEC-07): a workflow_call input is free text, not one of the dispatch
  # choices. A step can't do this — environment: and its secrets are
  # resolved before a job's first step. See scripts/workflow-inputs.sh.
  # -------------------------------------------------------------------------
  validate:
    name: Validate Inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check inputs
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          ACTION:      ${{ inputs.action }}
        run: |
          set -euo pipefail
          source scripts/workflow-inputs.sh
          check_environment "$ENVIRONMENT"
          check_action "$ACTION"

      # prod applies only a commit whose frontend stack stg applied first (on its own or in
      # a full-stack run). See check_stg_first in scripts/workflow-inputs.sh.
      - name: Check stg applied this commit first (prod apply)
        if: inputs.environment == 'prod' && inputs.action == 'apply'
        env:
          GH_TOKEN:    ${{ github.token }}
          ACTION:      ${{ inputs.action }}
          ENVIRONMENT: ${{ inputs.environment }}
          SHA:         ${{ github.sha }}
        run: |
          set -euo pipefail
          source scripts/workflow-inputs.sh
          check_stg_first frontend "$ACTION" "$ENVIRONMENT" "$SHA"

  terraform:
    name: Terraform Live Frontend ${{ inputs.action }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: infra-live-frontend/terraform
    env:
      TF_IN_AUTOMATION: "1"
      TF_VAR_app_name:             ${{ vars.APP_NAME }}
      TF_VAR_repository:          ${{ github.repository }}
      TF_VAR_spa_bucket_name: ${{ vars.SPA_BUCKET_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate required secrets and variables
        env:
          ROLE_ARN:             ${{ vars.ROLE_ARN }}
          APP_NAME:             ${{ vars.APP_NAME }}
          STATE_BUCKET:         ${{ vars.STATE_BUCKET }}
          SPA_BUCKET_NAME: ${{ vars.SPA_BUCKET_NAME }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          missing=()
          [[ -z "$ROLE_ARN"             ]] && missing+=("ROLE_ARN (variable)")
          [[ -z "$APP_NAME"             ]] && missing+=("APP_NAME (variable)")
          [[ -z "$STATE_BUCKET"         ]] && missing+=("STATE_BUCKET (variable)")
          [[ -z "$SPA_BUCKET_NAME" ]] && missing+=("SPA_BUCKET_NAME (variable)")
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "ERROR: Required GitHub environment secrets/variables are not set: ${missing[*]}"
            echo "Add them to the '${ENVIRONMENT}' GitHub environment and re-run."
            exit 1
          fi

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: ${{ vars.ROLE_ARN }}
          role-session-name: terraform-live-frontend-${{ inputs.environment }}
          # All resources in this module are in us-east-1.
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          # Off (SEC-06): the wrapper runs every later terraform call through
          # Node, which sees that step's env, secrets included.
          terraform_wrapper: false

      - name: Verify SSM parameters exist and are readable
        id: ssm
        if: inputs.action == 'plan' || inputs.action == 'apply'
        env:
          APP_NAME: ${{ vars.APP_NAME }}
          ENVIRONMENT: ${{ inputs.environment }}
          ACTION: ${{ inputs.action }}
        run: |
          # A missing parameter fails apply. A plan instead skips the Terraform
          # plan with a notice: on a brand-new environment infra-live-edge
          # has only been planned, not applied, so there is nothing to read
          # yet (terraform-live-all's plan hits this on every fresh env).
          missing=0
          check_ssm() {
            local name="$1"
            local value
            if ! value=$(aws ssm get-parameter --region us-east-1 --name "$name" --query "Parameter.Value" --output text 2>&1); then
              echo "Cannot read SSM parameter '$name': $value"
              missing=1
              return 0
            fi
            echo "OK: $name"
          }
          APP="${APP_NAME}"
          ENV="${ENVIRONMENT}"
          check_ssm "/$APP/$ENV/edge/cloudfront_arn"
          check_ssm "/$APP/$ENV/edge/s3_bucket_name"

          if [[ "$missing" -eq 0 ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [[ "${ACTION}" == "plan" ]]; then
            # A warning and the run summary, not a quiet notice: this run planned less than
            # it was asked to (production-readiness review, CI-17 c).
            echo "::warning title=Partial plan::infra-live-edge is not applied for this environment yet, so infra-live-frontend was NOT planned. Apply infra-live-edge first, then plan this stack."
            echo "### ⚠️ Partial plan: infra-live-frontend was not planned (infra-live-edge isn't applied yet)" >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: Ensure infra-live-edge has been applied and the IAM role has ssm:GetParameter on this path."
            exit 1
          fi

      - name: Terraform Init
        env:
          STATE_BUCKET: ${{ vars.STATE_BUCKET }}
          APP_NAME: ${{ vars.APP_NAME }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          # -lockfile=readonly: use exactly the provider versions and hashes in
          # the committed .terraform.lock.hcl (TF-01). A provider upgrade is a
          # reviewed commit (terraform init -upgrade + providers lock), never a
          # silent change in CI.
          terraform init \
            -lockfile=readonly \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=terraform-state-files/${APP_NAME}/${ENVIRONMENT}/frontend/us-east-1/terraform.tfstate"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        if: (inputs.action == 'plan' && steps.ssm.outputs.ready == 'true') || inputs.action == 'apply'
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: terraform plan -out=tfplan.bin -input=false -no-color -var-file="tfvars/${ENVIRONMENT}.tfvars"

      - name: Show plan summary
        if: (inputs.action == 'plan' && steps.ssm.outputs.ready == 'true') || inputs.action == 'apply'
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          {
            echo "### Terraform Plan — frontend / ${ENVIRONMENT}"
            echo '```'
            terraform show -no-color tfplan.bin | tee tfplan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The redacted text plan, not tfplan.bin: a binary plan holds every
      # variable unredacted (Redis token, origin secret, GitHub PAT), and
      # artifacts are downloadable by anyone with read access to the repo.
      - name: Upload plan artefact
        if: (inputs.action == 'plan' && steps.ssm.outputs.ready == 'true') || inputs.action == 'apply'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tfplan-frontend-${{ inputs.environment }}
          path: infra-live-frontend/terraform/tfplan.txt
          retention-days: 7

      - name: Terraform Apply
        if: inputs.action == 'apply'
        run: terraform apply -auto-approve tfplan.bin

      - name: Terraform Plan (destroy)
        if: inputs.action == 'plan-destroy' || inputs.action == 'destroy'
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: terraform plan -destroy -out=tfplan.bin -input=false -no-color -var-file="tfvars/${ENVIRONMENT}.tfvars"

      - name: Show destroy plan summary
        if: inputs.action == 'plan-destroy' || inputs.action == 'destroy'
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          {
            echo "### Terraform Destroy Plan — frontend / ${ENVIRONMENT}"
            echo '```'
            terraform show -no-color tfplan.bin | tee tfplan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload destroy plan artefact
        if: inputs.action == 'plan-destroy' || inputs.action == 'destroy'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tfplan-frontend-destroy-${{ inputs.environment }}
          path: infra-live-frontend/terraform/tfplan.txt
          retention-days: 7

      - name: Terraform Destroy
        if: inputs.action == 'destroy'
        run: terraform apply -auto-approve tfplan.bin
