# ---------------------------------------------------------------------------
# Full-stack orchestrator — provisions or tears down all infra, then deploys.
#
# backend_regions (comma-separated, e.g. ap-south-1,eu-west-1, or a JSON array
# from a caller such as the scheduler) is the FULL set of regions this run should apply — not "one more region to add".
# Step 1 and destroy step 3 fan out across every region in it as a GitHub
# Actions matrix (one terraform-live-backend instance per region, run in
# parallel); step 4 passes the whole list to deploy-live-backend, which
# builds once and fans out internally. Step 2 (edge) and destroy step 2 pass the
# same list straight through to terraform-live-edge.yml, since that module
# is a single shared distribution covering every region at once — passing
# anything less than the complete set would make Terraform destroy the
# missing regions' edge config, not just leave it alone.
#
# Apply order (plan / apply):
#   1. terraform-live-backend   VPC / ECS / ALB / Redis / ECR / Secrets Manager (per region, matrix)
#   2. terraform-live-edge      CloudFront / WAF / public DNS (all regions at once)
#   3. terraform-live-frontend  S3 bucket policy (OAC)
#   4. deploy-live-backend      Docker build once + push to every region's ECR + ECS rolling update per region (apply only)
#   5. deploy-live-frontend     React build + S3 sync + CF invalidation  (apply only)
#
# Destroy order (plan-destroy / destroy) — reverse dependency order:
#   1. terraform-live-frontend  Remove S3 bucket policy first
#   2. terraform-live-edge      Remove CloudFront / WAF (all regions at once)
#   3. terraform-live-backend   Remove VPC / ECS / ALB / Redis / ECR (per region, matrix)
# ---------------------------------------------------------------------------

name: Terraform Live — Full Stack
run-name: "Full Stack (${{ inputs.action }}, ${{ inputs.environment }}, ${{ inputs.backend_regions }})"

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action — deploy steps only run on apply; destroy runs in reverse dependency order"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
          - plan-destroy
          - destroy
      environment:
        description: "Deployment environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - sbx
          - stg
          - prod
      # Free text, checked against shared/routing.json's regions and turned into a
      # JSON array in the first job (TF-01): adding a region is one line in that file,
      # with no list of every combination to keep here.
      backend_regions:
        description: "The FULL set of regions to apply, comma-separated (not just the new one), e.g. ap-south-1,eu-west-1. Run 'plan' first to check for unintended deletions before 'apply'."
        required: true
        type: string
        default: "ap-south-1"
      # Passed straight through to terraform-live-edge.yml — see its
      # bootstrap_region input. "auto" = first region in backend_regions.
      bootstrap_region:
        description: "Region that serves login/health. 'auto' = first of backend_regions; a named region must be in backend_regions."
        required: false
        default: "auto"
        type: string
      deploy:
        description: "Run deploy-backend and deploy-frontend after apply (ignored for plan and for prod: promote from stg instead)"
        required: false
        default: "true"
        type: boolean
  workflow_call:
    inputs:
      action:
        required: true
        type: string
      environment:
        required: true
        type: string
      backend_regions:
        required: true
        type: string
      bootstrap_region:
        required: false
        type: string
        default: "auto"
      deploy:
        required: false
        type: boolean
        default: true

# OIDC token + repo read required by every called workflow; actions: read for their
# prod check that stg applied the commit first.
permissions:
  id-token: write
  contents: read
  actions: read

# One full-stack run per environment at a time, regardless of which regions
# it targets — terraform-live-edge's state is a single shared distribution
# per environment (not per-region), so two concurrent runs for the same
# environment but different region sets would race on that one state file
# even if their backend-region sets didn't overlap at all.
concurrency:
  group: terraform-live-all-superpower-${{ inputs.environment }}
  cancel-in-progress: false

jobs:

  # The typed regions, checked against shared/routing.json and turned into the JSON
  # array every step below reads (TF-01). No environment: nothing secret is loaded.
  regions:
    name: "0 · Check regions"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      regions: ${{ steps.check.outputs.regions }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check regions
        id: check
        env:
          REGIONS: ${{ inputs.backend_regions }}
        run: |
          set -euo pipefail
          source scripts/workflow-inputs.sh
          echo "regions=$(regions_json "$REGIONS")" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Step 1 — Backend infrastructure (one independent stack per region)
  # fail-fast: false — a Terraform apply/destroy already in progress for one
  # region must never be forcibly cancelled just because another region's
  # instance failed; that risks leaving it in a partial state. needs: below
  # already waits for every matrix instance to finish (success or failure)
  # regardless of this setting — fail-fast only controls whether a
  # still-running instance gets cancelled early, not the job's final verdict.
  # ---------------------------------------------------------------------------
  tf-backend:
    name: "1 · Terraform Backend (${{ matrix.region }})"
    needs: regions
    if: inputs.action == 'plan' || inputs.action == 'apply'
    strategy:
      fail-fast: false
      matrix:
        region: ${{ fromJson(needs.regions.outputs.regions) }}
    uses: ./.github/workflows/terraform-live-backend.yml
    with:
      action:      ${{ inputs.action }}
      environment: ${{ inputs.environment }}
      aws_region:  ${{ matrix.region }}
    secrets: inherit

  # ---------------------------------------------------------------------------
  # Step 2 — Edge (CloudFront + WAF + public DNS) — always us-east-1
  # Passes the complete backend_regions list straight through — needs: below
  # ensures every region in it has already been applied (its SSM
  # alb_internal_fqdn parameter exists) before this runs, or
  # terraform-live-edge's own SSM reads fail with a clear error.
  # ---------------------------------------------------------------------------
  tf-edge:
    name: "2 · Terraform Edge"
    needs: [regions, tf-backend]
    if: inputs.action == 'plan' || inputs.action == 'apply'
    uses: ./.github/workflows/terraform-live-edge.yml
    with:
      action:           ${{ inputs.action }}
      environment:      ${{ inputs.environment }}
      backend_regions:  ${{ needs.regions.outputs.regions }}
      bootstrap_region: ${{ inputs.bootstrap_region || 'auto' }}
    secrets: inherit

  # ---------------------------------------------------------------------------
  # Step 3 — Frontend bucket policy (always us-east-1)
  # No region input — the frontend module hardcodes us-east-1 for all
  # resources (S3 bucket policy, SSM reads) and the state key.
  # ---------------------------------------------------------------------------
  tf-frontend:
    name: "3 · Terraform Frontend"
    needs: tf-edge
    if: inputs.action == 'plan' || inputs.action == 'apply'
    uses: ./.github/workflows/terraform-live-frontend.yml
    with:
      action:      ${{ inputs.action }}
      environment: ${{ inputs.environment }}
    secrets: inherit

  # ---------------------------------------------------------------------------
  # Step 4 — Deploy backend (Docker build + ECS rolling update). A single call
  # covering every region: deploy-live-backend builds the image once, pushes
  # it to each region's ECR, then rolls ECS out per region in parallel
  # (fail-fast: false inside it). Skipped when action=plan or deploy=false, and
  # always for prod: prod gets only images promoted from stg (CI-03), so
  # terraform-live-all is infrastructure-only there (see prod-deploy-skipped).
  # ---------------------------------------------------------------------------
  deploy-backend:
    name: "4 · Deploy Backend"
    needs: [regions, tf-frontend]
    if: inputs.action == 'apply' && inputs.deploy && inputs.environment != 'prod'
    uses: ./.github/workflows/deploy-live-backend.yml
    with:
      environment: ${{ inputs.environment }}
      aws_regions: ${{ needs.regions.outputs.regions }}
    secrets: inherit

  # ---------------------------------------------------------------------------
  # Step 5 — Deploy frontend (React build + S3 sync + CloudFront invalidation)
  # Skipped when action=plan or deploy=false, and for prod (as step 4).
  # ---------------------------------------------------------------------------
  deploy-frontend:
    name: "5 · Deploy Frontend"
    needs: deploy-backend
    if: inputs.action == 'apply' && inputs.deploy && inputs.environment != 'prod'
    uses: ./.github/workflows/deploy-live-frontend.yml
    with:
      environment: ${{ inputs.environment }}
    secrets: inherit

  # ---------------------------------------------------------------------------
  # For prod with deploy=true (e.g. a scheduled start): say in the run why
  # nothing was deployed, and what to run next.
  # ---------------------------------------------------------------------------
  prod-deploy-skipped:
    name: "4 · Deploy skipped (prod)"
    needs: tf-frontend
    if: inputs.action == 'apply' && inputs.deploy && inputs.environment == 'prod'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Explain the skipped deploy
        run: |
          msg="prod isn't deployed by terraform-live-all (production-readiness review, CI-03): the infrastructure is applied, but the services keep their current images. To ship a release, run promote-live-backend and promote-live-frontend from stg to prod."
          echo "::notice title=Deploy skipped for prod::$msg"
          echo "### Deploy skipped for prod" >> "$GITHUB_STEP_SUMMARY"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Destroy step 1 — Frontend bucket policy (reverse order: remove OAC first)
  # ---------------------------------------------------------------------------
  destroy-tf-frontend:
    name: "D1 · Terraform Frontend (destroy)"
    if: inputs.action == 'plan-destroy' || inputs.action == 'destroy'
    uses: ./.github/workflows/terraform-live-frontend.yml
    with:
      action:      ${{ inputs.action }}
      environment: ${{ inputs.environment }}
    secrets: inherit

  # ---------------------------------------------------------------------------
  # Destroy step 2 — Edge (CloudFront / WAF) — same full-list pass-through as
  # the apply-side tf-edge job.
  # ---------------------------------------------------------------------------
  destroy-tf-edge:
    name: "D2 · Terraform Edge (destroy)"
    needs: [regions, destroy-tf-frontend]
    if: inputs.action == 'plan-destroy' || inputs.action == 'destroy'
    uses: ./.github/workflows/terraform-live-edge.yml
    with:
      action:           ${{ inputs.action }}
      environment:      ${{ inputs.environment }}
      backend_regions:  ${{ needs.regions.outputs.regions }}
      bootstrap_region: ${{ inputs.bootstrap_region || 'auto' }}
    secrets: inherit

  # ---------------------------------------------------------------------------
  # Destroy step 3 — Backend (VPC / ECS / ALB / Redis / ECR), one instance
  # per region — same fail-fast reasoning as tf-backend/deploy-backend.
  # ---------------------------------------------------------------------------
  destroy-tf-backend:
    name: "D3 · Terraform Backend (destroy) (${{ matrix.region }})"
    needs: [regions, destroy-tf-edge]
    if: inputs.action == 'plan-destroy' || inputs.action == 'destroy'
    strategy:
      fail-fast: false
      matrix:
        region: ${{ fromJson(needs.regions.outputs.regions) }}
    uses: ./.github/workflows/terraform-live-backend.yml
    with:
      action:      ${{ inputs.action }}
      environment: ${{ inputs.environment }}
      aws_region:  ${{ matrix.region }}
    secrets: inherit
