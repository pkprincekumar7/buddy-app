name: Deploy Live Backend
run-name: Deploy Live Backend (${{ inputs.service }}, ${{ inputs.environment }}, ${{ inputs.aws_regions }})

on:
  workflow_dispatch:
    inputs:
      # Free text, not a dropdown, so a service added in
      # infra-live-backend/terraform/services.tf is deployable with no workflow
      # change. Checked against the ecs_services list in SSM.
      service:
        description: "'all', or comma-separated service names from services.tf (e.g. backend,worker)"
        required: true
        default: "all"
        type: string
      environment:
        description: "Deployment environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - sbx
          - stg
          - prod
      # workflow_dispatch has no native multi-select input, so every valid
      # non-empty combination of the 3 supported regions is enumerated below
      # as its own choice (same list as terraform-live-all.yml) — adding a 4th
      # region means hand-adding its combinations here too (2^n - 1 total).
      # Each selected region runs as its own parallel matrix instance.
      aws_regions:
        description: "AWS region(s) — each runs as a separate parallel job"
        required: true
        type: choice
        options:
          - '["ap-south-1"]'
          - '["eu-west-1"]'
          - '["us-east-1"]'
          - '["ap-south-1","eu-west-1"]'
          - '["ap-south-1","us-east-1"]'
          - '["eu-west-1","us-east-1"]'
          - '["ap-south-1","eu-west-1","us-east-1"]'
  workflow_call:
    inputs:
      service:
        type: string
        required: false
        default: "all"
      environment:
        type: string
        required: true
      # JSON array, e.g. '["ap-south-1","eu-west-1"]' — same shape as the
      # workflow_dispatch choice. The image is built once and pushed to every
      # region in it.
      aws_regions:
        type: string
        required: true

permissions:
  id-token: write
  contents: read

# Locked per environment (not per service or region): one run at a time per
# environment across deploy, promote and restart, which share this namespace.
# Not per service: `service` is free text, so "all", "backend" and
# "worker, backend" would be different locks over the same ECS services.
concurrency:
  group: deploy-live-backend-superpower-${{ inputs.environment }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ---------------------------------------------------------------------------
  # Build the image once and push the identical image to every selected
  # region's ECR repository, so all regions run byte-for-byte the same build.
  # ---------------------------------------------------------------------------
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      image_tag: ${{ steps.git_meta.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Validate required secrets
        env:
          ROLE_ARN: ${{ secrets.ROLE_ARN }}
          APP_NAME: ${{ secrets.APP_NAME }}
        run: |
          missing=()
          [[ -z "$ROLE_ARN" ]] && missing+=("ROLE_ARN")
          [[ -z "$APP_NAME" ]] && missing+=("APP_NAME")
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "ERROR: Required GitHub environment secrets are not set: ${missing[*]}"
            echo "Add them to the '${{ inputs.environment }}' GitHub environment and re-run."
            exit 1
          fi

      # us-east-1 is the control-plane region (SSM); ECR calls below pass
      # --region explicitly for each target region.
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          role-to-assume: ${{ secrets.ROLE_ARN }}
          role-session-name: deploy-live-backend-${{ inputs.environment }}
          aws-region: us-east-1

      # -------------------------------------------------------------------------
      # Resolve every region's ECR repository up front (SSM parameters written
      # by terraform-live-backend.yml) so a missing region fails before the
      # build, not halfway through the pushes.
      # -------------------------------------------------------------------------
      - name: Resolve ECR repositories
        env:
          REGIONS: ${{ inputs.aws_regions }}
        run: |
          get_ssm() {
            aws ssm get-parameter --region us-east-1 --name "$1" --query "Parameter.Value" --output text 2>/dev/null || echo ""
          }

          : > ecr_targets.txt
          for REGION in $(echo "$REGIONS" | jq -r '.[]'); do
            ECR_URL=$(get_ssm "/${{ secrets.APP_NAME }}/${{ inputs.environment }}/backend/$REGION/ecr_repository_url")
            if [ -z "$ECR_URL" ]; then
              echo "ERROR: ECR repository URL for $REGION not found in SSM. Run terraform-live-backend workflow (apply) for $REGION first."
              exit 1
            fi
            echo "$REGION $ECR_URL" >> ecr_targets.txt
            echo "ECR ($REGION): $ECR_URL"
          done

      # -------------------------------------------------------------------------
      # Build once, push to each region's ECR.
      # Tagged with :<date>-<git-sha> only — ECR repositories use IMMUTABLE
      # tags so each tag can only be pushed once. :latest is intentionally
      # omitted; the SHA tag provides full traceability and safe rollbacks
      # without ever needing to overwrite a tag.
      # Git metadata is resolved here and passed as build args so the image
      # can serve it from /api/health without needing .git or the git binary.
      # -------------------------------------------------------------------------
      - name: Resolve git metadata
        id: git_meta
        run: |
          echo "sha=$(git rev-parse --short HEAD)"                                   >> "$GITHUB_OUTPUT"
          echo "branch=$(git rev-parse --abbrev-ref HEAD)"                           >> "$GITHUB_OUTPUT"
          echo "committed_at=$(git log -1 --format=%cI)"                             >> "$GITHUB_OUTPUT"
          echo "tag=$(git describe --tags --exact-match HEAD 2>/dev/null || echo '')" >> "$GITHUB_OUTPUT"
          echo "image_tag=$(date -u +%Y%m%d)-$(git rev-parse --short HEAD)"         >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            --build-arg GIT_SHA="${{ steps.git_meta.outputs.sha }}" \
            --build-arg GIT_BRANCH="${{ steps.git_meta.outputs.branch }}" \
            --build-arg GIT_COMMITTED_AT="${{ steps.git_meta.outputs.committed_at }}" \
            --build-arg GIT_TAG="${{ steps.git_meta.outputs.tag }}" \
            -t "backend:${{ steps.git_meta.outputs.image_tag }}" \
            -f backend/Dockerfile \
            .

      - name: Push image to each region's ECR
        env:
          TAG: ${{ steps.git_meta.outputs.image_tag }}
        run: |
          while read -r REGION REPO; do
            REGISTRY="${REPO%%/*}"    # <account>.dkr.ecr.<region>.amazonaws.com
            REPO_NAME="${REPO#*/}"    # strip registry host, keep <app>/<env>/backend
            IMAGE="$REPO:$TAG"

            aws ecr get-login-password --region "$REGION" \
              | docker login --username AWS --password-stdin "$REGISTRY"

            # IMMUTABLE tags — pushing the same tag twice (e.g., re-running a
            # failed workflow) would error. If the tag already exists the image
            # is identical, so skip the push and proceed.
            if aws ecr describe-images \
                 --region "$REGION" \
                 --repository-name "$REPO_NAME" \
                 --image-ids imageTag="$TAG" \
                 --output text &>/dev/null; then
              echo "Image $IMAGE already exists in ECR — skipping push."
            else
              docker tag "backend:$TAG" "$IMAGE"
              docker push "$IMAGE"
              echo "Pushed: $IMAGE"
            fi
          done < ecr_targets.txt

  # ---------------------------------------------------------------------------
  # Roll the pushed image out to ECS, one parallel instance per region.
  # fail-fast: false — an in-flight rollout in one region must never be
  # cancelled just because another region's instance failed.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy Live Backend (${{ matrix.aws_region }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        aws_region: ${{ fromJson(inputs.aws_regions) }}
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          role-to-assume: ${{ secrets.ROLE_ARN }}
          role-session-name: deploy-live-backend-${{ inputs.environment }}
          aws-region: ${{ matrix.aws_region }}

      # -------------------------------------------------------------------------
      # Every service in this region's ecs_services list (written by
      # terraform-live-backend from services.tf), narrowed to inputs.service,
      # rolled out one after another in the list's order — the API first, so
      # it's healthy before job consumers restart against it. Each gets a new
      # revision of its task definition with only its container's image
      # swapped; the ECS circuit breaker rolls back a revision that fails to
      # reach steady state, and the deploy stops there. Helpers:
      # scripts/ecs-services.sh.
      # -------------------------------------------------------------------------
      - name: Deploy services
        env:
          SSM_BASE: /${{ secrets.APP_NAME }}/${{ inputs.environment }}/backend/${{ matrix.aws_region }}
          SELECTION: ${{ inputs.service }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          source scripts/ecs-services.sh

          CLUSTER=$(get_ssm "$SSM_BASE/ecs_cluster_name")
          ECR_URL=$(get_ssm "$SSM_BASE/ecr_repository_url")
          if [ -z "$CLUSTER" ] || [ -z "$ECR_URL" ]; then
            echo "ERROR: ECS cluster or ECR repository not found in SSM under $SSM_BASE. Run terraform-live-backend workflow (apply) first."
            exit 1
          fi
          SERVICES=$(resolve_services "$SSM_BASE" "$SELECTION")

          IMAGE="$ECR_URL:$IMAGE_TAG"
          echo "Image:    $IMAGE"
          echo "Cluster:  $CLUSTER"
          echo "Services: $(jq -r '[.[].name] | join(", ")' <<<"$SERVICES")"

          # Every service runs the same build; its command picks the entry point.
          same_image() { echo "$IMAGE"; }
          deploy_image "$CLUSTER" "$SERVICES" same_image
