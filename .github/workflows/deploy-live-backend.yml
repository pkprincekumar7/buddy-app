name: Deploy Live Backend
run-name: Deploy Live Backend (${{ inputs.service }}, ${{ inputs.environment }}, ${{ inputs.aws_regions }})

on:
  workflow_dispatch:
    inputs:
      # Free text, not a dropdown, so a service added in
      # infra-live-backend/terraform/services.tf is deployable with no workflow
      # logic change. Checked against the ecs_services list in SSM. The names in
      # the description are only help text, but scripts/check-service-lists.sh
      # (CI) fails if they don't match services.tf, in deploy_order.
      service:
        description: "Services to deploy: all, or a comma-separated list of: otel-collector, auth, auth-worker, users, users-worker, children, children-worker, onboarding, onboarding-worker, discover, discover-worker, grow, grow-worker, transform, transform-worker, release, release-worker, shared (e.g. users,users-worker). Rolled out in parallel."
        required: true
        default: "all"
        type: string
      # No prod (production-readiness review, CI-03): prod runs only images and
      # builds promoted from stg (promote-live-backend / promote-live-frontend),
      # never a fresh build. The validate job refuses prod from workflow_call too.
      environment:
        description: "Deployment environment (prod: use the promote workflow)"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - sbx
          - stg
      # Free text, checked against shared/routing.json's regions in the validate job and
      # turned into a JSON array there (TF-01): adding a region is one line in that file.
      # Each region runs as its own parallel matrix instance.
      aws_regions:
        description: "AWS region(s), comma-separated, e.g. ap-south-1 or ap-south-1,eu-west-1 (supported: shared/routing.json's regions)"
        required: true
        type: string
        default: "ap-south-1"
  workflow_call:
    inputs:
      service:
        type: string
        required: false
        default: "all"
      environment:
        type: string
        required: true
      # A JSON array, e.g. '["ap-south-1","eu-west-1"]', or a comma-separated
      # list. Each image is built once and pushed to every region in it.
      aws_regions:
        type: string
        required: true

permissions:
  id-token: write
  contents: read

# Locked per environment (not per service or region): one run at a time per
# environment across deploy, promote and restart, which share this namespace.
# Not per service: `service` is free text, so "all", "users" and
# "users-worker, users" would be different locks over the same ECS services.
concurrency:
  group: deploy-live-backend-superpower-${{ inputs.environment }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # -------------------------------------------------------------------------
  # Checks the inputs first, before any environment's secrets are loaded
  # (SEC-07): a workflow_call input is free text, not one of the dispatch
  # choices. A step can't do this — environment: and its secrets are
  # resolved before a job's first step. See scripts/workflow-inputs.sh.
  # -------------------------------------------------------------------------
  validate:
    name: Validate Inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # The checked regions as a JSON array: what every later job reads (TF-01).
      regions: ${{ steps.check.outputs.regions }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check inputs
        id: check
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          REGIONS:     ${{ inputs.aws_regions }}
        run: |
          set -euo pipefail
          source scripts/workflow-inputs.sh
          check_deploy_environment "$ENVIRONMENT"
          echo "regions=$(regions_json "$REGIONS")" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Resolve once, before building: which runtimes the selection covers, which
  # images they need (one per service: a worker runs its service's), and the
  # image tag every build pushes. Read from the first selected region's
  # ecs_services list; each deploy instance re-checks its own region.
  # ---------------------------------------------------------------------------
  resolve:
    name: Resolve services and images
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    outputs:
      images: ${{ steps.list.outputs.images }}
      image_tag: ${{ steps.git_meta.outputs.image_tag }}
      sha: ${{ steps.git_meta.outputs.sha }}
      branch: ${{ steps.git_meta.outputs.branch }}
      committed_at: ${{ steps.git_meta.outputs.committed_at }}
      tag: ${{ steps.git_meta.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate required secrets and variables
        env:
          ROLE_ARN: ${{ vars.ROLE_ARN }}
          APP_NAME: ${{ vars.APP_NAME }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          missing=()
          [[ -z "$ROLE_ARN" ]] && missing+=("ROLE_ARN (variable)")
          [[ -z "$APP_NAME" ]] && missing+=("APP_NAME (variable)")
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "ERROR: Required GitHub environment secrets/variables are not set: ${missing[*]}"
            echo "Add them to the '${ENVIRONMENT}' GitHub environment and re-run."
            exit 1
          fi

      # us-east-1 is the control-plane region (SSM).
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: ${{ vars.ROLE_ARN }}
          role-session-name: deploy-live-backend-${{ inputs.environment }}
          aws-region: us-east-1

      - name: List services and images
        id: list
        env:
          FIRST_REGION: ${{ fromJson(needs.validate.outputs.regions)[0] }}
          SELECTION: ${{ inputs.service }}
          APP_NAME: ${{ vars.APP_NAME }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          source scripts/ecs-services.sh
          SERVICES=$(resolve_services "/${APP_NAME}/${ENVIRONMENT}/backend/$FIRST_REGION" "$SELECTION")
          SERVICES=$(image_runtimes "$SERVICES" "$SELECTION")
          IMAGES=$(image_services "$SERVICES")
          echo "images=$IMAGES" >> "$GITHUB_OUTPUT"
          echo "Deploying: $(jq -r '[.[].name] | join(", ")' <<<"$SERVICES")"
          echo "Building:  $(jq -r 'join(", ")' <<<"$IMAGES")"

      # Resolved once so every build pushes the same tag, and so the image can
      # serve its git metadata from /health without .git or the git binary.
      # Tagged :<date>-<git-sha> only: the repositories use IMMUTABLE tags, so
      # a tag is pushed once and never overwritten (no :latest).
      - name: Resolve git metadata
        id: git_meta
        run: |
          {
            echo "sha=$(git rev-parse --short HEAD)"
            echo "branch=$(git rev-parse --abbrev-ref HEAD)"
            echo "committed_at=$(git log -1 --format=%cI)"
            echo "tag=$(git describe --tags --exact-match HEAD 2>/dev/null || echo '')"
            echo "image_tag=$(date -u +%Y%m%d)-$(git rev-parse --short HEAD)"
          } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # One image per selected service (docs/auth-users-split.md 15.2): built once
  # with --build-arg SERVICE=<service> and pushed to that service's repository
  # in every selected region, so all regions run byte-for-byte the same build.
  # fail-fast: false lets the other images finish; the deploy waits for all.
  # ---------------------------------------------------------------------------
  build:
    name: Build & Push (${{ matrix.image_service }})
    needs: [validate, resolve]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        image_service: ${{ fromJson(needs.resolve.outputs.images) }}
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: ${{ vars.ROLE_ARN }}
          role-session-name: deploy-live-backend-${{ inputs.environment }}
          aws-region: us-east-1

      # Every region's repository for this service, from its ecs_services list
      # (terraform-live-backend), up front, so a missing region fails before
      # the build, not halfway through the pushes.
      - name: Resolve ECR repositories
        env:
          REGIONS: ${{ needs.validate.outputs.regions }}
          IMAGE_SERVICE: ${{ matrix.image_service }}
          APP_NAME: ${{ vars.APP_NAME }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          source scripts/ecs-services.sh
          : > ecr_targets.txt
          for REGION in $(jq -r '.[]' <<<"$REGIONS"); do
            SERVICES=$(resolve_services "/${APP_NAME}/${ENVIRONMENT}/backend/$REGION" all)
            REPO=$(repository_for "$SERVICES" "$IMAGE_SERVICE")
            echo "$REGION $REPO" >> ecr_targets.txt
            echo "ECR ($REGION): $REPO"
          done

      - name: Build Docker image
        env:
          IMAGE_SERVICE: ${{ matrix.image_service }}
          TAG: ${{ needs.resolve.outputs.image_tag }}
          GIT_SHA: ${{ needs.resolve.outputs.sha }}
          GIT_BRANCH: ${{ needs.resolve.outputs.branch }}
          GIT_COMMITTED_AT: ${{ needs.resolve.outputs.committed_at }}
          GIT_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          echo "Building backend/$IMAGE_SERVICE"
          docker build \
            --platform linux/amd64 \
            --build-arg SERVICE="$IMAGE_SERVICE" \
            --build-arg GIT_SHA="$GIT_SHA" \
            --build-arg GIT_BRANCH="$GIT_BRANCH" \
            --build-arg GIT_COMMITTED_AT="$GIT_COMMITTED_AT" \
            --build-arg GIT_TAG="$GIT_TAG" \
            -t "$IMAGE_SERVICE:$TAG" \
            -f backend/Dockerfile \
            .

      # The image pushed is the image scanned (CI-03): a HIGH or CRITICAL CVE with a
      # fix fails the build before anything is pushed, as check.yml's image scan
      # does (same options; .trivyignore holds the reviewed exceptions).
      - name: Scan the image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.image_service }}:${{ needs.resolve.outputs.image_tag }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln
          exit-code: '1'

      # Each pushed image also gets the <tag>-scanned marker (scripts/ecs-services.sh),
      # which promote requires. A tag already in ECR (a re-run) is another build of the
      # same commit, not the one just scanned, so it's pulled and scanned itself before
      # it's marked.
      - name: Push image to each region's ECR
        env:
          IMAGE_SERVICE: ${{ matrix.image_service }}
          TAG: ${{ needs.resolve.outputs.image_tag }}
        run: |
          set -euo pipefail
          source scripts/ecs-services.sh
          while read -r REGION REPO; do
            REGISTRY="${REPO%%/*}"    # <account>.dkr.ecr.<region>.amazonaws.com
            REPO_NAME="${REPO#*/}"    # strip registry host, keep <app>/<env>/<service>
            IMAGE="$REPO:$TAG"

            aws ecr get-login-password --region "$REGION" \
              | docker login --username AWS --password-stdin "$REGISTRY"

            # IMMUTABLE tags — pushing the same tag twice (e.g., re-running a
            # failed workflow) would error. If the tag already exists the image
            # is identical, so skip the push and proceed.
            if [ -n "$(image_digest "$REGION" "$REPO_NAME" "$TAG")" ]; then
              echo "Image $IMAGE already exists in ECR — skipping push."
              if ! is_scanned "$REGION" "$REPO_NAME" "$TAG"; then
                echo "$IMAGE has no scan marker: scanning the image in ECR."
                docker pull "$IMAGE"
                trivy image --severity HIGH,CRITICAL --exit-code 1 --scanners vuln --ignore-unfixed "$IMAGE"
              fi
            else
              docker tag "$IMAGE_SERVICE:$TAG" "$IMAGE"
              docker push "$IMAGE"
              echo "Pushed: $IMAGE"
            fi
            mark_scanned "$REGION" "$REPO_NAME" "$TAG"
            echo "Scanned: $IMAGE ($(image_digest "$REGION" "$REPO_NAME" "$TAG"))"
          done < ecr_targets.txt

  # ---------------------------------------------------------------------------
  # Roll the pushed images out to ECS, one parallel instance per region.
  # fail-fast: false — an in-flight rollout in one region must never be
  # cancelled just because another region's instance failed.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy Live Backend (${{ matrix.aws_region }})
    needs: [validate, resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        aws_region: ${{ fromJson(needs.validate.outputs.regions) }}
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: ${{ vars.ROLE_ARN }}
          role-session-name: deploy-live-backend-${{ inputs.environment }}
          aws-region: ${{ matrix.aws_region }}

      # -------------------------------------------------------------------------
      # Every service in this region's ecs_services list (written by
      # terraform-live-backend from services.tf), narrowed to inputs.service,
      # rolled out all at once (each is an independent ECS service, so the
      # deploy takes as long as the slowest one; log lines are prefixed with
      # the service name). Each gets a new revision of its task definition
      # with only its container's image swapped for its service's new image;
      # the ECS circuit breaker rolls back a revision that fails to reach
      # steady state. A failure doesn't stop the others: the step fails at the
      # end, naming the services left on their previous image. The collector
      # (a pinned image) isn't deployed. Helpers: scripts/ecs-services.sh.
      # -------------------------------------------------------------------------
      - name: Deploy services
        env:
          SSM_BASE: /${{ vars.APP_NAME }}/${{ inputs.environment }}/backend/${{ matrix.aws_region }}
          SELECTION: ${{ inputs.service }}
          IMAGE_TAG: ${{ needs.resolve.outputs.image_tag }}
        run: |
          source scripts/ecs-services.sh

          CLUSTER=$(get_ssm "$SSM_BASE/ecs_cluster_name")
          if [ -z "$CLUSTER" ]; then
            echo "ERROR: ECS cluster not found in SSM under $SSM_BASE. Run terraform-live-backend workflow (apply) first."
            exit 1
          fi
          SERVICES=$(resolve_services "$SSM_BASE" "$SELECTION")
          SERVICES=$(image_runtimes "$SERVICES" "$SELECTION")

          echo "Tag:      $IMAGE_TAG"
          echo "Cluster:  $CLUSTER"
          echo "Services: $(jq -r '[.[].name] | join(", ")' <<<"$SERVICES")"

          # Each runtime runs its service's image from its service's repository.
          service_image() {
            local repo
            repo=$(jq -r '.ecr_repository_url' <<<"$1")
            [ -n "$repo" ] && [ "$repo" != "null" ] || { echo "ERROR: no ECR repository for $(jq -r .name <<<"$1")." >&2; return 1; }
            echo "$repo:$IMAGE_TAG"
          }
          deploy_image "$CLUSTER" "$SERVICES" service_image
