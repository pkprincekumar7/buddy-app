name: Check

on:
  push:
    branches: ["main"]
  # Pull requests into develop too: feature work merges there before main, so it's
  # checked before it lands rather than only when develop goes to main.
  pull_request:
    branches: ["main", "develop"]
  # Weekly, so new CVEs (Trivy, pip-audit, npm/yarn audit, retire.js) and CodeQL queries
  # are checked against main even in a week with no push (production-readiness review,
  # CI-17 b).
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TF_VERSION: "1.16.4"

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements-dev.txt
            backend/requirements-lint.txt
            backend/requirements-test.txt

      # The services' runtime packages (their union), the lint tools and the test tools: mypy
      # checks the tests too, and without pytest it can't see that pytest.skip() never
      # returns, so a skipped test's `str | None` stays unnarrowed (as check.sh's venv has them).
      - name: Install dependencies + dev tools
        run: pip install -r requirements-dev.txt -r requirements-lint.txt -r requirements-test.txt

      - name: ruff check
        run: ruff check .

      - name: ruff format (check only)
        run: ruff format --check .

      - name: mypy type check
        run: mypy tools/ common/

      # Every directory under backend/ with requirements.txt is a service; each gets its own
      # job below (backend-service). This fails on a malformed one or an orphaned spec.
      - name: Service tree valid
        run: python tools/services.py --check

      # Service import boundaries (docs/auth-users-split.md, section 2): common never
      # imports service code, and services never import each other. The contracts are
      # generated from the services in the tree.
      - name: import-linter
        run: python tools/import_contracts.py

      # The shared package must install on its own and with each extra, the way every
      # service image installs it (build plan 0.1).
      - name: Install common (core and extras)
        run: pip install ./common './common[generation,uploads]'

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend-lint]
    defaults:
      run:
        working-directory: backend
    # MongoDB isn't a service container: services can't pass the --replSet flag, and
    # change streams and transactions need a replica set. A step starts it instead,
    # the same way docker-compose.yml does (build plan 0.3).
    services:
      # Health checks make GitHub wait until each service accepts connections
      # before the first step runs (it otherwise only waits for "started").
      valkey:
        image: valkey/valkey:8.0.11-alpine@sha256:fd348c9b6999ef15719a1d6b43b810ee1bf2068ded2d7ab6f6dd15943841f28b
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start MongoDB 8.0 (single-node replica set)
        run: bash ../scripts/ci-start-mongo.sh

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements-dev.txt
            backend/requirements-test.txt

      - name: Install dependencies + test tools
        run: pip install -r requirements-dev.txt -r requirements-test.txt

      # common's and the tools' tests (each service has its own job below). The gate keeps
      # common's line + branch coverage from slipping.
      - name: pytest + coverage (common, tools)
        timeout-minutes: 10
        run: pytest common/tests tools/tests --cov=common --cov-branch --cov-report=term-missing --cov-fail-under=99 -q
        env:
          # The live tests run against the MongoDB replica set and the Valkey started above
          # (MONGODB_TEST_URI, so local runs never touch a real cluster).
          MONGODB_TEST_URI: mongodb://localhost:27017/?directConnection=true
          # A skipped live_service test (Mongo/Redis unreachable) fails the run instead
          # of passing silently — see common/tests/conftest.py.
          REQUIRE_LIVE_SERVICES: "1"
          REDIS_URL: redis://localhost:6379

  # ── per-service jobs (build plan 0.5) ────────────────────────────────────────
  # The services are found from the tree (backend/tools/services.py), so a new one gets its
  # job without editing this file. Each installs only its own requirements.txt, the way its
  # image does, which proves the file is complete.
  backend-service-list:
    name: Backend Service List
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      services: ${{ steps.list.outputs.services }}
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: List services
        id: list
        run: echo "services=$(python tools/services.py --json)" >> "$GITHUB_OUTPUT"

  backend-service:
    name: Backend Service (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend-lint, backend-service-list]
    if: needs.backend-service-list.outputs.services != '[]'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.backend-service-list.outputs.services) }}
    env:
      SERVICE: ${{ matrix.service }}
    defaults:
      run:
        working-directory: backend
    services:
      valkey:
        image: valkey/valkey:8.0.11-alpine@sha256:fd348c9b6999ef15719a1d6b43b810ee1bf2068ded2d7ab6f6dd15943841f28b
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start MongoDB 8.0 (single-node replica set)
        run: bash ../scripts/ci-start-mongo.sh

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            backend/${{ matrix.service }}/requirements.txt
            backend/requirements-test.txt
            backend/requirements-lint.txt

      # buddy-common comes from this tree's backend/common only, never from PyPI.
      - name: Install the service alone (as its image does) + test tools
        run: bash ../scripts/install-backend-service.sh "$SERVICE" requirements-test.txt requirements-lint.txt

      - name: mypy type check
        run: mypy "$SERVICE/"

      # A hung test fails the step instead of holding the job to its limit.
      - name: pytest + coverage
        timeout-minutes: 10
        run: pytest "$SERVICE/tests" --cov="$SERVICE" --cov-branch --cov-report=term-missing --cov-fail-under=99 -q
        env:
          MONGODB_TEST_URI: mongodb://localhost:27017/?directConnection=true
          REDIS_URL: redis://localhost:6379
          REQUIRE_LIVE_SERVICES: "1"
          # Not what the tests run as: each testkit pins APP_ENV=local (it sets the event
          # topics' prefix), and auth's conftest pins it in the process too, for the cookie
          # names common.cookies reads at import. A different value here checks that nothing
          # else leaks in from the environment.
          APP_ENV: dev

      # backend/openapi/<service>.json is committed; Spectral lints the
      # committed copies in the dast job.
      - name: OpenAPI spec up to date
        run: |
          if [ ! -f "$SERVICE/app/main.py" ]; then
            echo "$SERVICE serves no HTTP yet"
            exit 0
          fi
          python tools/export-openapi.py --service "$SERVICE" > "openapi/$SERVICE.json"
          if [ -n "$(git status --porcelain -- "openapi/$SERVICE.json")" ]; then
            git diff -- "openapi/$SERVICE.json"
            echo "::error::backend/openapi/$SERVICE.json is missing or out of date. Run check.sh locally and commit the regenerated file."
            exit 1
          fi

  # One stable check name for branch protection, whatever services exist.
  backend-services:
    name: Backend Services
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [backend-service-list, backend-service]
    if: always()
    steps:
      - name: All service jobs passed
        env:
          LIST_RESULT: ${{ needs.backend-service-list.result }}
          SERVICES: ${{ needs.backend-service-list.outputs.services }}
          RESULT: ${{ needs.backend-service.result }}
        run: |
          if [ "$LIST_RESULT" != success ]; then
            echo "Listing the services failed: $LIST_RESULT"; exit 1
          fi
          if [ "$RESULT" = success ] || { [ "$RESULT" = skipped ] && [ "$SERVICES" = "[]" ]; }; then
            echo "Services: $SERVICES"; exit 0
          fi
          echo "Service jobs: $RESULT"; exit 1

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Both apps' typed API files, generated from backend/openapi/*.json with
      # openapi-typescript from frontend/node_modules (build plan 7.1).
      - name: API clients in sync with backend/openapi
        run: node ../scripts/sync-api-clients.mjs --check

      - name: ESLint
        run: npm run lint

      - name: Prettier (check only)
        run: ./node_modules/.bin/prettier --check "src/**/*.{ts,tsx,css}"

      - name: TypeScript type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Bundle size budget (main JS ≤ 1.4 MB)
        run: |
          BUNDLES=(dist/assets/index-*.js)
          BUNDLE="${BUNDLES[0]}"
          if [ ! -f "$BUNDLE" ]; then echo "No bundle found"; exit 1; fi
          SIZE=$(wc -c < "$BUNDLE")
          LIMIT=1468006
          echo "Bundle: $BUNDLE — ${SIZE} bytes (limit ${LIMIT})"
          [ "$SIZE" -le "$LIMIT" ] || { echo "Main bundle exceeds 1.4 MB limit"; exit 1; }

  frontend-app-lint:
    name: Frontend App Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend-app

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: frontend-app/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: ESLint
        run: yarn lint

      - name: Prettier (check only)
        run: ./node_modules/.bin/prettier --check "src/**/*.{ts,tsx}"

      - name: TypeScript type check
        run: node_modules/.bin/tsc --noEmit

      - name: Jest (unit tests)
        run: yarn test --ci

  lambda-edge-test:
    name: Lambda@Edge Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      # Needed to render jwt-validator-lambda.js.tpl through real
      # `terraform apply` (not a hand-rolled reimplementation of HCL's
      # templatefile() syntax), so the test exercises exactly what gets
      # deployed.
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          # Off (SEC-06): the wrapper runs every later terraform call through
          # Node, which sees that step's env, secrets included.
          terraform_wrapper: false

      # shared/routing.json is the single source of truth for country → location →
      # region; the backend and both frontends commit generated copies of it.
      - name: Routing data in sync with shared/routing.json
        run: node scripts/sync-routing.mjs --check

      # shared/service-routes.json drives both the ALB rules and the local gateway's
      # nginx config (docs/auth-users-split.md, 13.1; build plan 0.3).
      - name: Gateway config in sync with shared/service-routes.json
        run: node scripts/sync-gateway.mjs --check

      - name: Run jwt-validator-lambda unit tests
        run: node --test infra-live-edge/functions/jwt-validator-lambda.test.js

      - name: Run spa-rewrite CloudFront Function unit tests
        run: node --test infra-live-edge/functions/spa-rewrite.test.js

      # The deploy / restart / promote backend workflows' shared helpers,
      # against a fake aws CLI (no AWS access).
      - name: Run ecs-services.sh tests
        run: bash scripts/ecs-services.test.sh

      # terraform-live-backend's first-apply fill of the per-service secrets,
      # against a fake aws CLI (fake values only).
      - name: Run fill-service-secrets.sh tests
        run: bash scripts/fill-service-secrets.test.sh

      - name: Run service-token-keys.sh tests
        run: bash scripts/service-token-keys.test.sh

      # The frontend deploy's S3 sync, invalidation and asset pruning (CI-07),
      # against a fake aws CLI.
      - name: Run frontend-publish.sh tests
        run: bash scripts/frontend-publish.test.sh

      # The frontend releases kept for rollback-live-frontend (CI-07): save, prune, restore.
      - name: Run frontend release tests
        run: bash scripts/frontend-release.test.sh

      # The reusable workflows' input checks (SEC-07): environment, action, regions.
      - name: Run workflow-inputs.sh tests
        run: bash scripts/workflow-inputs.test.sh

      # The scheduler's GitHub dispatcher (SCH-01): standard library only, so the
      # runner's Python is enough; no AWS or GitHub access.
      - name: Run scheduler dispatcher tests
        run: python3 infra-live-scheduler/lambda/test_dispatcher.py

      # The service names in deploy/restart/promote's `service` input
      # descriptions (help text) must match services.tf, in deploy_order.
      - name: Service lists match services.tf
        run: bash scripts/check-service-lists.sh

      # Every tracked shell script, check.sh included, so a new one needs no list here.
      - name: ShellCheck (every shell script)
        run: git ls-files -z '*.sh' | xargs -0 shellcheck -x

  # Lint and test are two jobs that run side by side, so the tests don't wait for validate
  # and tflint (validate inits every stack and module, CI-15; the tests init them again).
  terraform-lint:
    name: Terraform Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          # Off (SEC-06): the wrapper runs every later terraform call through
          # Node, which sees that step's env, secrets included.
          terraform_wrapper: false

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      # Providers shared by every init in this job, and kept between runs, keyed by the lock
      # files: a version change in any of them starts a fresh cache. Terraform reuses a cached
      # provider only where the lock file has its Linux hash (the stacks do); elsewhere it
      # downloads it again.
      - name: Share the Terraform provider cache
        run: |
          mkdir -p "$RUNNER_TEMP/tf-plugin-cache"
          echo "TF_PLUGIN_CACHE_DIR=$RUNNER_TEMP/tf-plugin-cache" >> "$GITHUB_ENV"

      - name: Restore the Terraform provider cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/tf-plugin-cache
          key: terraform-providers-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: terraform-providers-${{ runner.os }}-

      # A misspelled argument or attribute, a wrong type or a missing reference fails
      # here (CI-15), not at plan time in an environment. -backend=false: no state, no
      # credentials; the committed lock files pick the provider versions.
      - name: Terraform validate (every stack and module)
        run: |
          for d in infra-live-*/terraform/ modules/*/; do
            echo "── terraform validate $d"
            (cd "$d" && terraform init -backend=false -input=false >/dev/null && terraform validate -no-color)
          done

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@b480b8fcdaa6f2c577f8e4fa799e89e756bb7c93 # v6.2.2
        with:
          tflint_version: v0.62.1

      # The plugins .tflint.hcl names (the AWS ruleset, CI-15), at their pinned versions.
      # The token only raises GitHub's API rate limit for the download.
      - name: Install TFLint plugins
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: tflint --init --config="$GITHUB_WORKSPACE/.tflint.hcl"

      - name: TFLint (infra-live-backend)
        run: tflint --chdir=infra-live-backend/terraform --config="$GITHUB_WORKSPACE/.tflint.hcl"

      - name: TFLint (infra-live-edge)
        run: tflint --chdir=infra-live-edge/terraform --config="$GITHUB_WORKSPACE/.tflint.hcl"

      - name: TFLint (infra-live-frontend)
        run: tflint --chdir=infra-live-frontend/terraform --config="$GITHUB_WORKSPACE/.tflint.hcl"

      - name: TFLint (infra-live-scheduler)
        run: tflint --chdir=infra-live-scheduler/terraform --config="$GITHUB_WORKSPACE/.tflint.hcl"

      # Shared modules (TF-01) — linted on their own as well as through the
      # stacks that call them.
      - name: TFLint (modules)
        run: |
          for m in modules/*/; do
            echo "── tflint $m"
            tflint --chdir="$m" --config="$GITHUB_WORKSPACE/.tflint.hcl"
          done

  terraform-test:
    name: Terraform Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          # Off (SEC-06): the wrapper runs every later terraform call through
          # Node, which sees that step's env, secrets included.
          terraform_wrapper: false

      # Providers shared by every init in this job, and kept between runs, keyed by the lock
      # files: a version change in any of them starts a fresh cache. Terraform reuses a cached
      # provider only where the lock file has its Linux hash (the stacks do); elsewhere it
      # downloads it again.
      - name: Share the Terraform provider cache
        run: |
          mkdir -p "$RUNNER_TEMP/tf-plugin-cache"
          echo "TF_PLUGIN_CACHE_DIR=$RUNNER_TEMP/tf-plugin-cache" >> "$GITHUB_ENV"

      - name: Restore the Terraform provider cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/tf-plugin-cache
          key: terraform-providers-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: terraform-providers-${{ runner.os }}-

      # terraform test against a mock AWS provider: no credentials, nothing is
      # created. Each module's own tests, plus each stack's own tests.
      - name: Terraform test (modules + stacks)
        run: |
          for d in modules/*/ infra-live-backend/terraform/ infra-live-edge/terraform/ infra-live-frontend/terraform/ infra-live-scheduler/terraform/; do
            echo "── terraform test $d"
            (cd "$d" && terraform init -backend=false -input=false >/dev/null && terraform test)
          done

      # Every stack with each environment's own tfvars (tests/envs), so a tfvars change
      # that breaks one environment fails here, not at its next apply.
      - name: Terraform test per environment (infra-live-*)
        run: |
          for d in infra-live-*/terraform/; do
            (cd "$d" && terraform init -backend=false -input=false >/dev/null)
            for env in dev sbx stg prod; do
              # The scheduler has no prod (SEC-03): prod is never scheduled.
              if [ "$env" = prod ] && [ "$d" = infra-live-scheduler/terraform/ ]; then continue; fi
              echo "── terraform test $d ($env)"
              (cd "$d" && terraform test -test-directory=tests/envs -filter="tests/envs/$env.tftest.hcl" -var-file="tfvars/$env.tfvars")
            done
          done

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [backend-lint, frontend-lint, frontend-app-lint]

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0  # gitleaks needs full git history to scan past commits

      # ── secret & infra scanning ──────────────────────────────────────────────
      # Every binary downloaded here is checked before it runs (production-readiness
      # review, CI-04). gitleaks: against the SHA-256 GitHub records for the release
      # asset, pinned here, so a replaced asset is refused even with a matching
      # checksums file. Bump the version and the digest together.
      # Every download in this file retries (--retry-all-errors): a 5xx from GitHub's
      # release servers is usually gone a few seconds later, and failing here skips the
      # whole job.
      - name: Install gitleaks
        run: |
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 10 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o /tmp/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks_8.30.1_linux_x64.tar.gz" \
            | sha256sum --check --strict
          tar -xz -C /usr/local/bin gitleaks < /tmp/gitleaks_8.30.1_linux_x64.tar.gz

      - name: Gitleaks (secret detection)
        id: gitleaks
        continue-on-error: true
        run: gitleaks detect --source . --redact --config .gitleaks.toml

      - name: Hadolint (backend Dockerfile lint)
        id: hadolint_backend
        continue-on-error: true
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: backend/Dockerfile

      - name: Hadolint (frontend Dockerfile lint)
        id: hadolint_frontend
        continue-on-error: true
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: frontend/Dockerfile

      # ── Python security tools ────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements-security.txt

      - name: Install Python security tools
        run: pip install -r backend/requirements-security.txt

      - name: Bandit (Python SAST)
        id: bandit
        continue-on-error: true
        run: |
          read -ra SERVICE_DIRS <<< "$(python backend/tools/services.py --paths backend/)"
          bandit -r backend/tools/ backend/common/ "${SERVICE_DIRS[@]}" -ll -q

      - name: Semgrep (SAST)
        id: semgrep
        continue-on-error: true
        run: |
          read -ra SERVICE_DIRS <<< "$(python backend/tools/services.py --paths backend/)"
          mkdir -p sarif
          semgrep --config p/security-audit --error --sarif-output=sarif/semgrep.sarif \
            backend/tools/ backend/common/ "${SERVICE_DIRS[@]}" frontend/src/ frontend-app/src/

      - name: pip-audit (backend dependency CVEs)
        id: pip_audit
        continue-on-error: true
        run: |
          bash scripts/audit-backend-services.sh pip-audit python

      # Every Terraform root and module in one scan from the repo root: checkov 3.2
      # given several -d scans only the first, once per flag (CI-08).
      - name: Checkov (Terraform IaC security)
        id: checkov
        continue-on-error: true
        run: |
          mkdir -p sarif
          checkov -d . --framework terraform --quiet --compact --skip-download \
            --skip-path node_modules --skip-path '\.terraform' --skip-path '\.venv' \
            -o cli -o sarif --output-file-path console,sarif/checkov.sarif

      # ── Node.js security tools ───────────────────────────────────────────────
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Set up Node (frontend-app)
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: frontend-app/yarn.lock

      - name: Install frontend-app dependencies
        run: yarn install --frozen-lockfile
        working-directory: frontend-app

      - name: npm audit (frontend dependency CVEs)
        id: npm_audit
        continue-on-error: true
        # Ignored (no fixed release exists): GHSA-vfj7-8cjw-p6xm — braces <=3.0.3 DoS;
        # only via build tooling (tailwindcss, spectral-cli). Remove once a fix ships.
        run: |
          npm audit --json 2>/dev/null | python3 -c "
          import json,sys
          IGNORED={'GHSA-qwww-vcr4-c8h2','GHSA-mh99-v99m-4gvg','GHSA-vfj7-8cjw-p6xm'}
          d=json.load(sys.stdin)
          def is_ignored(v, all_vulns):
              for x in v.get('via',[]):
                  if isinstance(x,dict):
                      url=x.get('url','')
                      if not any(i in url for i in IGNORED): return False
                  elif isinstance(x,str):
                      dep=all_vulns.get(x,{})
                      if not is_ignored(dep, all_vulns): return False
              return True
          vulns=d.get('vulnerabilities',{})
          bad=[k for k,v in vulns.items() if v['severity'] in ('high','critical') and not is_ignored(v,vulns)]
          sys.exit(1 if bad else 0)
          "
        working-directory: frontend

      - name: yarn audit (frontend-app dependency CVEs)
        id: yarn_audit_frontend_app
        continue-on-error: true
        # yarn v1 --json outputs NDJSON; parse it to filter known-acceptable advisories.
        # Ignored: 1124334 (GHSA-mh99-v99m-4gvg) — brace-expansion DoS; only in dev
        # tooling (eslint, jest), never shipped to the production bundle.
        # image-size's GHSA-5p2g-fcmc-qvqq/GHSA-w3rx-r6r6-pgpr (formerly flagged as
        # advisory IDs 1138808/1138809, now 1239765/1239766) is fixed by forcing
        # image-size to ^2.0.4 via frontend-app/package.json's resolutions/overrides —
        # no ignore needed any more.
        # Also ignored (no fixed release exists; remove once one ships):
        #   1240992 (GHSA-vfj7-8cjw-p6xm) — braces <=3.0.3 DoS; build/test tooling only.
        #   1240912 (GHSA-86w9-cpqp-85rv) — node-forge <=1.4.0; only via @expo/cli (dev CLI).
        # Also ignored (fix needs a major upgrade the dev tools don't support yet):
        #   1243066 (GHSA-mrhx-c7xc-m3w5) — zod <4.6.6 DoS; only via @expo/cli (zod 3) and
        #   eslint-plugin-react-hooks. Dev tooling, not in the APK/IPA. Remove once both use zod >=4.6.6.
        run: |
          yarn audit --json 2>/dev/null | python3 -c "
          import json,sys
          IGNORED_IDS={1124334,1240992,1240912,1243066}
          high=0
          for line in sys.stdin:
              line=line.strip()
              if not line: continue
              try: obj=json.loads(line)
              except: continue
              if obj.get('type')!='auditAdvisory': continue
              adv=obj['data']['advisory']
              if adv.get('id') in IGNORED_IDS: continue
              if adv.get('severity') in ('high','critical'): high+=1
          sys.exit(1 if high else 0)
          "
        working-directory: frontend-app

      # The ISO week, so the retire.js database is fetched again at least weekly, not
      # only when a lockfile changes (CI-17 a; check.sh refreshes weekly too).
      - name: This week, for the retire.js cache key
        id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Restore retire.js database cache
        id: retiredb_cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: frontend/retire-jsrepo.json
          # Refreshes when JS deps change and every week. An exact miss restores the
          # latest older cache, but cache-hit is then false, so the fetch below runs.
          key: retiredb-${{ runner.os }}-${{ steps.week.outputs.week }}-${{ hashFiles('frontend/package-lock.json', 'frontend-app/yarn.lock') }}
          restore-keys: retiredb-${{ runner.os }}-

      - name: Fetch retire.js vulnerability database
        if: steps.retiredb_cache.outputs.cache-hit != 'true'
        run: curl -sSfL --retry 5 --retry-all-errors --retry-delay 10 https://raw.githubusercontent.com/RetireJS/retire.js/master/repository/jsrepository-v5.json -o retire-jsrepo.json
        working-directory: frontend

      - name: Retire.js (browser library CVE scan)
        id: retire
        continue-on-error: true
        # retire-jsrepo.json is fetched/restored above — --jsrepo prevents retire.js
        # from making its own network request and guarantees the same DB is used.
        run: ./node_modules/.bin/retire --path . --exitwith 1 --jsrepo ./retire-jsrepo.json
        working-directory: frontend

      - name: Retire.js (frontend-app library CVE scan)
        id: retire_frontend_app
        continue-on-error: true
        run: ./node_modules/.bin/retire --path ../frontend-app --exitwith 1 --jsrepo ./retire-jsrepo.json
        working-directory: frontend

      # ── CVE scanning (Trivy advisory DB) ────────────────────────────────────
      - name: Trivy (backend dependency CVE scan)
        id: trivy_backend_vuln
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: backend/
          severity: HIGH,CRITICAL
          exit-code: '1'
          scanners: vuln

      - name: Trivy (frontend dependency CVE scan)
        id: trivy_frontend_vuln
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: frontend/
          severity: HIGH,CRITICAL
          exit-code: '1'
          scanners: vuln

      # trivyignores: the brace-expansion/Newtonsoft.Json exceptions plus the no-fix
      # braces (CVE-2026-93687) and node-forge (CVE-2026-85393) dev-tooling CVEs —
      # image-size's CVE-2025-71329/CVE-2025-71330 is now fixed (see
      # frontend-app/.trivyignore and frontend-app/package.json's resolutions).
      - name: Trivy (frontend-app dependency CVE scan)
        id: trivy_frontend_app_vuln
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: frontend-app/
          severity: HIGH,CRITICAL
          exit-code: '1'
          scanners: vuln
          trivyignores: frontend-app/.trivyignore

      # ── license compliance (Trivy) ───────────────────────────────────────────
      - name: Trivy (backend license scan)
        id: trivy_backend_license
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: backend/
          severity: HIGH,CRITICAL
          exit-code: '1'
          scanners: license

      - name: Trivy (frontend license scan)
        id: trivy_frontend_license
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: frontend/
          severity: HIGH,CRITICAL
          exit-code: '1'
          scanners: license

      - name: Trivy (frontend-app license scan)
        id: trivy_frontend_app_license
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: frontend-app/
          severity: HIGH,CRITICAL
          exit-code: '1'
          scanners: license

      # ── IaC config security scan (tfsec rule set via trivy config) ───────────
      # Runs a different rule set than checkov — catches infra misconfigurations
      # that checkov's AWS-focused rules can miss (network exposure, open ports, etc.)
      # trivy config accepts exactly one DIR; run once per infra module.
      - name: Trivy config (infra-live-backend)
        id: trivy_config_backend
        continue-on-error: true
        run: trivy config infra-live-backend/terraform --exit-code 1 --severity HIGH,CRITICAL

      - name: Trivy config (infra-live-edge)
        id: trivy_config_edge
        continue-on-error: true
        run: trivy config infra-live-edge/terraform --exit-code 1 --severity HIGH,CRITICAL

      - name: Trivy config (infra-live-frontend)
        id: trivy_config_frontend
        continue-on-error: true
        run: trivy config infra-live-frontend/terraform --exit-code 1 --severity HIGH,CRITICAL

      - name: Trivy config (infra-live-scheduler)
        id: trivy_config_scheduler
        continue-on-error: true
        run: trivy config infra-live-scheduler/terraform --exit-code 1 --severity HIGH,CRITICAL

      - name: Trivy config (modules)
        id: trivy_config_modules
        continue-on-error: true
        run: trivy config modules --exit-code 1 --severity HIGH,CRITICAL

      # The same rule set over the whole repo, as SARIF for GitHub code scanning
      # (CI-08); reporting only, the five steps above gate. Runs whenever they ran (even
      # failing): if an earlier step stopped the job, trivy was never set up, and this
      # would only bury that error under "trivy: command not found".
      - name: Trivy config (SARIF report)
        if: ${{ !cancelled() && steps.trivy_config_modules.outcome != 'skipped' }}
        run: |
          mkdir -p sarif
          trivy config . --severity HIGH,CRITICAL --format sarif --output sarif/trivy-config.sarif \
            --skip-dirs '**/node_modules' --skip-dirs '**/.terraform' --skip-dirs '**/.venv'

      # Picked up by the code-scanning job, which alone may write security events.
      - name: Upload SARIF reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarif-reports
          path: sarif/
          retention-days: 7
          if-no-files-found: warn
          overwrite: true

      # ── Docker image scans (OS-level CVEs inside each service's image) ───────
      # One image per service (backend/Dockerfile, --build-arg SERVICE), found from the tree
      # (backend/tools/services.py). The base image is pinned by digest (CI-03), so this scans
      # the same base a deploy builds on; Debian fixes arrive as Dependabot digest bumps.
      - name: Build the service images
        run: |
          for svc in $(python backend/tools/services.py); do
            docker build --build-arg GIT_SHA="${GITHUB_SHA}" --build-arg SERVICE="$svc" \
              -t "superpower-$svc:scan" -f backend/Dockerfile .
          done

      - name: Trivy (service image scans)
        id: trivy_image
        continue-on-error: true
        run: |
          failed=()
          for svc in $(python backend/tools/services.py); do
            echo "── $svc"
            trivy image --severity HIGH,CRITICAL --exit-code 1 --scanners vuln \
              --ignore-unfixed "superpower-$svc:scan" || failed+=("$svc")
          done
          if [ ${#failed[@]} -gt 0 ]; then echo "::error::Image CVEs: ${failed[*]}"; exit 1; fi

      # ── CIS Docker Benchmark ─────────────────────────────────────────────────
      # Checks image configuration (root user, exposed secrets in layers,
      # missing HEALTHCHECK, etc.) — separate concern from CVE scanning.
      # Checked against a pinned SHA-256 (from the release's checksums file) before it
      # runs (CI-04). Bump the version and the digest together.
      - name: Install Dockle
        run: |
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 10 https://github.com/goodwithtech/dockle/releases/download/v0.4.15/dockle_0.4.15_Linux-64bit.tar.gz \
            -o /tmp/dockle_0.4.15_Linux-64bit.tar.gz
          echo "8bfc9183d1d3d67800edb45bea4bb63ddf1d28bec5f89944075a07007d79caad  /tmp/dockle_0.4.15_Linux-64bit.tar.gz" \
            | sha256sum --check --strict
          tar -xz -C /usr/local/bin dockle < /tmp/dockle_0.4.15_Linux-64bit.tar.gz

      - name: Dockle (CIS Docker Benchmark)
        id: dockle
        continue-on-error: true
        run: |
          failed=()
          for svc in $(python backend/tools/services.py); do
            echo "── $svc"
            dockle -af settings.py --ignore DKL-DI-0005 "superpower-$svc:scan" || failed+=("$svc")
          done
          if [ ${#failed[@]} -gt 0 ]; then echo "::error::Dockle: ${failed[*]}"; exit 1; fi

      # ── SBOM generation ──────────────────────────────────────────────────────
      - name: Generate SBOMs (service images)
        run: |
          for svc in $(python backend/tools/services.py); do
            trivy image --format cyclonedx --output "sbom-backend-$svc.cyclonedx.json" "superpower-$svc:scan"
          done

      - name: Upload SBOM artifact (services)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-backend
          path: sbom-backend-*.cyclonedx.json
          retention-days: 90

      - name: Generate SBOM (frontend filesystem)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: frontend/
          format: cyclonedx
          output: sbom-frontend.cyclonedx.json

      - name: Upload SBOM artifact (frontend)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-frontend
          path: sbom-frontend.cyclonedx.json
          retention-days: 90

      - name: Generate SBOM (frontend-app filesystem)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: frontend-app/
          format: cyclonedx
          output: sbom-frontend-app.cyclonedx.json

      - name: Upload SBOM artifact (frontend-app)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-frontend-app
          path: sbom-frontend-app.cyclonedx.json
          retention-days: 90

      # ── fail gate: surface all check results before failing the job ──────────
      - name: Fail if any security check failed
        if: always()
        env:
          GITLEAKS_OUTCOME: ${{ steps.gitleaks.outcome }}
          HADOLINT_BACKEND_OUTCOME: ${{ steps.hadolint_backend.outcome }}
          HADOLINT_FRONTEND_OUTCOME: ${{ steps.hadolint_frontend.outcome }}
          BANDIT_OUTCOME: ${{ steps.bandit.outcome }}
          SEMGREP_OUTCOME: ${{ steps.semgrep.outcome }}
          PIP_AUDIT_OUTCOME: ${{ steps.pip_audit.outcome }}
          CHECKOV_OUTCOME: ${{ steps.checkov.outcome }}
          NPM_AUDIT_OUTCOME: ${{ steps.npm_audit.outcome }}
          YARN_AUDIT_FRONTEND_APP_OUTCOME: ${{ steps.yarn_audit_frontend_app.outcome }}
          RETIRE_OUTCOME: ${{ steps.retire.outcome }}
          RETIRE_FRONTEND_APP_OUTCOME: ${{ steps.retire_frontend_app.outcome }}
          TRIVY_BACKEND_VULN_OUTCOME: ${{ steps.trivy_backend_vuln.outcome }}
          TRIVY_FRONTEND_VULN_OUTCOME: ${{ steps.trivy_frontend_vuln.outcome }}
          TRIVY_FRONTEND_APP_VULN_OUTCOME: ${{ steps.trivy_frontend_app_vuln.outcome }}
          TRIVY_BACKEND_LICENSE_OUTCOME: ${{ steps.trivy_backend_license.outcome }}
          TRIVY_FRONTEND_LICENSE_OUTCOME: ${{ steps.trivy_frontend_license.outcome }}
          TRIVY_FRONTEND_APP_LICENSE_OUTCOME: ${{ steps.trivy_frontend_app_license.outcome }}
          TRIVY_CONFIG_BACKEND_OUTCOME: ${{ steps.trivy_config_backend.outcome }}
          TRIVY_CONFIG_EDGE_OUTCOME: ${{ steps.trivy_config_edge.outcome }}
          TRIVY_CONFIG_FRONTEND_OUTCOME: ${{ steps.trivy_config_frontend.outcome }}
          TRIVY_CONFIG_SCHEDULER_OUTCOME: ${{ steps.trivy_config_scheduler.outcome }}
          TRIVY_CONFIG_MODULES_OUTCOME: ${{ steps.trivy_config_modules.outcome }}
          TRIVY_IMAGE_OUTCOME: ${{ steps.trivy_image.outcome }}
          DOCKLE_OUTCOME: ${{ steps.dockle.outcome }}
        run: |
          FAILED_CHECKS=()
          [[ "${GITLEAKS_OUTCOME}"              == "failure" ]] && FAILED_CHECKS+=(gitleaks)
          [[ "${HADOLINT_BACKEND_OUTCOME}"      == "failure" ]] && FAILED_CHECKS+=(hadolint-backend)
          [[ "${HADOLINT_FRONTEND_OUTCOME}"     == "failure" ]] && FAILED_CHECKS+=(hadolint-frontend)
          [[ "${BANDIT_OUTCOME}"                == "failure" ]] && FAILED_CHECKS+=(bandit)
          [[ "${SEMGREP_OUTCOME}"               == "failure" ]] && FAILED_CHECKS+=(semgrep)
          [[ "${PIP_AUDIT_OUTCOME}"             == "failure" ]] && FAILED_CHECKS+=(pip-audit)
          [[ "${CHECKOV_OUTCOME}"               == "failure" ]] && FAILED_CHECKS+=(checkov)
          [[ "${NPM_AUDIT_OUTCOME}"             == "failure" ]] && FAILED_CHECKS+=(npm-audit)
          [[ "${YARN_AUDIT_FRONTEND_APP_OUTCOME}"     == "failure" ]] && FAILED_CHECKS+=(yarn-audit-frontend-app)
          [[ "${RETIRE_OUTCOME}"                == "failure" ]] && FAILED_CHECKS+=(retire.js)
          [[ "${RETIRE_FRONTEND_APP_OUTCOME}"         == "failure" ]] && FAILED_CHECKS+=(retire.js-frontend-app)
          [[ "${TRIVY_BACKEND_VULN_OUTCOME}"    == "failure" ]] && FAILED_CHECKS+=(trivy-backend-vuln)
          [[ "${TRIVY_FRONTEND_VULN_OUTCOME}"   == "failure" ]] && FAILED_CHECKS+=(trivy-frontend-vuln)
          [[ "${TRIVY_FRONTEND_APP_VULN_OUTCOME}"     == "failure" ]] && FAILED_CHECKS+=(trivy-frontend-app-vuln)
          [[ "${TRIVY_BACKEND_LICENSE_OUTCOME}" == "failure" ]] && FAILED_CHECKS+=(trivy-backend-license)
          [[ "${TRIVY_FRONTEND_LICENSE_OUTCOME}" == "failure" ]] && FAILED_CHECKS+=(trivy-frontend-license)
          [[ "${TRIVY_FRONTEND_APP_LICENSE_OUTCOME}"  == "failure" ]] && FAILED_CHECKS+=(trivy-frontend-app-license)
          [[ "${TRIVY_CONFIG_BACKEND_OUTCOME}"   == "failure" ]] && FAILED_CHECKS+=(trivy-config-backend)
          [[ "${TRIVY_CONFIG_EDGE_OUTCOME}"      == "failure" ]] && FAILED_CHECKS+=(trivy-config-edge)
          [[ "${TRIVY_CONFIG_FRONTEND_OUTCOME}"  == "failure" ]] && FAILED_CHECKS+=(trivy-config-frontend)
          [[ "${TRIVY_CONFIG_SCHEDULER_OUTCOME}" == "failure" ]] && FAILED_CHECKS+=(trivy-config-scheduler)
          [[ "${TRIVY_CONFIG_MODULES_OUTCOME}"   == "failure" ]] && FAILED_CHECKS+=(trivy-config-modules)
          [[ "${TRIVY_IMAGE_OUTCOME}"            == "failure" ]] && FAILED_CHECKS+=(trivy-image)
          [[ "${DOCKLE_OUTCOME}"                == "failure" ]] && FAILED_CHECKS+=(dockle)
          if [ ${#FAILED_CHECKS[@]} -gt 0 ]; then
            echo "Failed security checks: ${FAILED_CHECKS[*]}"
            exit 1
          fi
          echo "All security checks passed."

  dast:
    name: DAST & API Spec
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [backend-lint, frontend-lint, frontend-app-lint]
    # Nuclei scans the local stack (docker-compose.yml) through its gateway, the way the ALB
    # fronts the services: every service and worker, Mongo, Valkey and Moto, with throwaway
    # keys generated in the job.

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies (for the Moto setup)
        run: pip install -r backend/requirements-dev.txt

      # Throwaway values for this run only, never printed.
      - name: Write the stack's .env
        run: |
          key=$(openssl genrsa 2048 2>/dev/null | awk 'NF {sub(/\r/,""); printf "%s\\n",$0}')
          {
            echo "JWT_PRIVATE_KEY=$key"
            echo "EMAIL_HMAC_PEPPER=$(openssl rand -hex 32)"
            # Moto in its container for every AWS call, S3 included (LOCAL_S3_URL), and for the
            # presigned URLs (LOCAL_S3_PUBLIC_URL); Mongo and the fake keys are compose's defaults.
            echo "LOCAL_MOTO_URL=http://moto:5000"
            echo "LOCAL_S3_URL=http://moto:5000"
            echo "LOCAL_S3_PUBLIC_URL=http://localhost:5050"
          } > .env

      - name: Start Moto and create the topics, queues and buckets
        run: |
          docker compose --profile moto up -d --wait moto
          python scripts/local-aws-setup.py
        env:
          LOCAL_MOTO_URL: http://localhost:5050
          AWS_ACCESS_KEY_ID: local
          AWS_SECRET_ACCESS_KEY: local

      - name: Start the stack
        run: docker compose up -d --build

      # The gateway publishes only shared's /api/health, so each service's /health is read
      # inside its container.
      - name: Wait for the gateway and the services
        run: |
          up() {
            curl -sf http://localhost:8088/gateway/health > /dev/null || return 1
            for svc in $(python backend/tools/services.py); do
              docker compose exec -T "$svc" python -c \
                "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')" \
                > /dev/null 2>&1 || return 1
            done
          }
          for i in {1..60}; do
            if up; then echo "The stack is up"; exit 0; fi
            echo "Waiting... ($i/60)"
            sleep 3
          done
          docker compose ps
          docker compose logs --tail 50
          echo "The stack failed to start within 3 minutes"
          exit 1

      # ── OpenAPI spec linting (Spectral) ──────────────────────────────────────
      # spectral-cli is a devDependency in frontend/package.json — no global install needed.
      - name: Set up Node (for spectral)
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies (includes spectral)
        run: npm ci
        working-directory: frontend

      # The services' committed specs (backend/openapi/*.json); the backend-service job
      # checks each one matches its code.
      - name: Spectral (service OpenAPI specs)
        id: spectral_services
        continue-on-error: true
        run: |
          shopt -s nullglob
          specs=(backend/openapi/*.json)
          if [ ${#specs[@]} -eq 0 ]; then echo "No service specs yet"; exit 0; fi
          frontend/node_modules/.bin/spectral lint "${specs[@]}" --ruleset .spectral.yaml --fail-severity error

      # ── Dynamic Application Security Testing (Nuclei) ────────────────────────
      # Checked against a pinned SHA-256 (from the release's checksums file) before it
      # runs (CI-04). Bump the version and the digest together.
      - name: Install Nuclei
        run: |
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 10 https://github.com/projectdiscovery/nuclei/releases/download/v3.3.9/nuclei_3.3.9_linux_amd64.zip \
            -o /tmp/nuclei_3.3.9_linux_amd64.zip
          echo "dfecedc31364d70b7291b347c74fd4d1d3185d30301c025b7490717d29daf28a  /tmp/nuclei_3.3.9_linux_amd64.zip" \
            | sha256sum --check --strict
          unzip -q /tmp/nuclei_3.3.9_linux_amd64.zip -d /tmp/nuclei-bin
          mv /tmp/nuclei-bin/nuclei /usr/local/bin/nuclei

      - name: Nuclei (DAST)
        id: nuclei
        continue-on-error: true
        run: |
          nuclei -u http://localhost:8088 \
            -t http/misconfiguration,http/exposures,http/technologies \
            -severity medium,high,critical \
            -silent -no-color

      # ── fail gate ────────────────────────────────────────────────────────────
      - name: Fail if any DAST check failed
        if: always()
        env:
          SPECTRAL_SERVICES_OUTCOME: ${{ steps.spectral_services.outcome }}
          NUCLEI_OUTCOME: ${{ steps.nuclei.outcome }}
        run: |
          FAILED_CHECKS=()
          [[ "${SPECTRAL_SERVICES_OUTCOME}" == "failure" ]] && FAILED_CHECKS+=(spectral-services)
          [[ "${NUCLEI_OUTCOME}"   == "failure" ]] && FAILED_CHECKS+=(nuclei)
          if [ ${#FAILED_CHECKS[@]} -gt 0 ]; then
            echo "Failed DAST checks: ${FAILED_CHECKS[*]}"
            exit 1
          fi
          echo "All DAST checks passed."

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend-lint, frontend-lint, frontend-app-lint]
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          # Python and JS/TS are analysed from source: no build step (CI-17 b).
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"

  # Uploads the security scan's SARIF (semgrep, checkov, trivy config) to GitHub code
  # scanning, next to CodeQL's, so findings keep a triage history (production-readiness
  # review, CI-08). Its own job: security-events: write never reaches the job that runs
  # the scanners. Skipped where GitHub gives a read-only token (fork and Dependabot
  # PRs). Blocking merges on findings is a repository ruleset (docs/ci-cd.md).
  code-scanning:
    name: Upload Code Scanning Results
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: security-scan
    if: >-
      always() && needs.security-scan.result != 'skipped' && github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        tool: [semgrep, checkov, trivy-config]

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # No artifact when the scan job stopped before any scanner ran: nothing to upload,
      # and that job's own failure is the one to read. The steps below skip without a file.
      - name: Download SARIF reports
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sarif-reports
          path: sarif/

      # A check skipped in the code with its reason (checkov's `#checkov:skip=`) is still in
      # the SARIF, marked `suppressions`, and code scanning opens an alert for it anyway.
      # Dropped here, so an alert is only a finding nobody has justified.
      - name: Drop the suppressed results
        if: hashFiles(format('sarif/{0}.sarif', matrix.tool)) != ''
        env:
          SARIF: sarif/${{ matrix.tool }}.sarif
        run: |
          jq '.runs |= map(.results |= map(select((.suppressions // []) | length == 0)))' \
            "$SARIF" > "$SARIF.tmp"
          mv "$SARIF.tmp" "$SARIF"

      - name: Upload ${{ matrix.tool }} results
        if: hashFiles(format('sarif/{0}.sarif', matrix.tool)) != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: sarif/${{ matrix.tool }}.sarif
          category: ${{ matrix.tool }}

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # What pull-requests: write is for: a summary on the PR when it fails (CI-17 e).
          comment-summary-in-pr: on-failure
