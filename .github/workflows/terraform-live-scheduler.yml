# ---------------------------------------------------------------------------
# Terraform — EventBridge Scheduler (per-environment)
#
# Manages the AWS EventBridge Scheduler resources that trigger GitHub Actions
# workflows at exact IST times (no GitHub Actions queue delay).
#
# This workflow is per-environment — select the target environment via the
# `environment` input. Each environment gets its own Terraform state and its
# own EventBridge resources (connection, destination, schedules).
#
# The GitHub PAT is read from the GIT_ACTIONS_PAT environment secret and
# stored in Secrets Manager on every apply. GitHub environment secret is the
# source of truth — no manual AWS CLI updates needed.
#
# Required PAT permissions:
#   Classic token : repo + workflow scopes
#   Fine-grained  : Actions — Read and Write
# ---------------------------------------------------------------------------

name: Terraform Live — Scheduler
run-name: "Terraform Scheduler (${{ inputs.environment }}, ${{ inputs.action }}, schedule=${{ inputs.schedule_enabled }}, regions=${{ inputs.target_aws_regions }})"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - sbx
          - stg
          - prod
      action:
        description: "Terraform action"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
          - plan-destroy
          - destroy
      schedule_enabled:
        description: "Enable or disable the EventBridge schedules for this environment"
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      # Free text, checked against shared/routing.json's regions and turned into a
      # JSON array in the first job (TF-01): adding a region is one line in that file,
      # with no list of every combination to keep here.
      target_aws_regions:
        description: "The FULL set of regions the daily schedules should apply/destroy, comma-separated, e.g. ap-south-1,eu-west-1. Run 'plan' first to check for unintended deletions before 'apply'."
        required: true
        type: string
        default: "ap-south-1"

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-live-scheduler-${{ inputs.environment }}-superpower
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  TF_VERSION: "1.16.4"
  TF_VAR_aws_region: "us-east-1"

jobs:
  # Checks the inputs before the environment's secrets are loaded (SEC-07), and turns the
  # typed regions into the JSON array the schedules send (TF-01).
  validate:
    name: Validate Inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      regions: ${{ steps.check.outputs.regions }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check inputs
        id: check
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          ACTION:      ${{ inputs.action }}
          REGIONS:     ${{ inputs.target_aws_regions }}
        run: |
          set -euo pipefail
          source scripts/workflow-inputs.sh
          check_environment "$ENVIRONMENT"
          check_action "$ACTION"
          echo "regions=$(regions_json "$REGIONS")" >> "$GITHUB_OUTPUT"

  terraform:
    name: "Terraform Scheduler — ${{ inputs.environment }} / ${{ inputs.action }}"
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: infra-live-scheduler/terraform
    env:
      TF_IN_AUTOMATION: "1"
      TF_VAR_app_name:            ${{ vars.APP_NAME }}
      TF_VAR_repository:          ${{ github.repository }}
      TF_VAR_environment:         ${{ inputs.environment }}
      # TF_VAR_github_pat is set on the plan, apply and destroy steps only
      # (SEC-06): a job-level secret reaches every step, third-party
      # actions included.
      TF_VAR_schedule_enabled:    ${{ inputs.schedule_enabled }}
      # Overrides the tfvars file's value below only if tfvars doesn't also
      # set this variable — it no longer does (see tfvars/*.tfvars), so this
      # workflow input is now the sole source, matching how schedule_enabled
      # already works (Terraform's -var-file on the command line would beat
      # TF_VAR_* otherwise, since -var-file is evaluated after environment
      # variables).
      TF_VAR_target_aws_regions: ${{ needs.validate.outputs.regions }}
      # The dispatcher's alert email (alarms.tf, SCH-01), where enable_alarms = true (stg).
      TF_VAR_ops_email: ${{ vars.OPS_EMAIL }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate required secrets and variables
        env:
          ROLE_ARN:        ${{ vars.ROLE_ARN }}
          APP_NAME:        ${{ vars.APP_NAME }}
          STATE_BUCKET:    ${{ vars.STATE_BUCKET }}
          GIT_ACTIONS_PAT: ${{ secrets.GIT_ACTIONS_PAT }}
        run: |
          missing=()
          [[ -z "$ROLE_ARN"        ]] && missing+=("ROLE_ARN (variable)")
          [[ -z "$APP_NAME"        ]] && missing+=("APP_NAME (variable)")
          [[ -z "$STATE_BUCKET"    ]] && missing+=("STATE_BUCKET (variable)")
          [[ -z "$GIT_ACTIONS_PAT" ]] && missing+=("GIT_ACTIONS_PAT")
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "ERROR: Required GitHub environment secrets/variables are not set: ${missing[*]}"
            exit 1
          fi

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: ${{ vars.ROLE_ARN }}
          role-session-name: terraform-live-scheduler-${{ inputs.environment }}
          aws-region: us-east-1

      # Derive GitHub repo owner and name from runtime context — no hardcoding.
      - name: Resolve Terraform variables
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          echo "TF_VAR_github_repo_owner=${GITHUB_REPOSITORY_OWNER}"     >> "$GITHUB_ENV"
          echo "TF_VAR_github_repo_name=${REPOSITORY_NAME}" >> "$GITHUB_ENV"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          # Off (SEC-06): the wrapper runs every later terraform call through
          # Node, which sees that step's env, secrets included.
          terraform_wrapper: false

      - name: Terraform Init
        env:
          STATE_BUCKET: ${{ vars.STATE_BUCKET }}
          APP_NAME: ${{ vars.APP_NAME }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          # -lockfile=readonly: use exactly the provider versions and hashes in
          # the committed .terraform.lock.hcl (TF-01). A provider upgrade is a
          # reviewed commit (terraform init -upgrade + providers lock), never a
          # silent change in CI.
          terraform init \
            -lockfile=readonly \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=terraform-state-files/${APP_NAME}/${ENVIRONMENT}/scheduler/us-east-1/terraform.tfstate"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        if: inputs.action == 'plan'
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          TF_VAR_github_pat: ${{ secrets.GIT_ACTIONS_PAT }}
        run: terraform plan -out=tfplan.bin -input=false -no-color -var-file="tfvars/${ENVIRONMENT}.tfvars"

      - name: Show plan summary
        if: inputs.action == 'plan'
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          {
            echo "### Terraform Plan — scheduler (${ENVIRONMENT})"
            echo '```'
            terraform show -no-color tfplan.bin | tee tfplan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The redacted text plan, not tfplan.bin: a binary plan holds every
      # variable unredacted (Redis token, origin secret, GitHub PAT), and
      # artifacts are downloadable by anyone with read access to the repo.
      - name: Upload plan artefact
        if: inputs.action == 'plan'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tfplan-scheduler-${{ inputs.environment }}
          path: infra-live-scheduler/terraform/tfplan.txt
          retention-days: 7

      - name: Terraform Apply
        if: inputs.action == 'apply'
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          TF_VAR_github_pat: ${{ secrets.GIT_ACTIONS_PAT }}
        run: terraform apply -auto-approve -input=false -no-color -var-file="tfvars/${ENVIRONMENT}.tfvars"

      - name: Terraform Plan (destroy)
        if: inputs.action == 'plan-destroy'
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          TF_VAR_github_pat: ${{ secrets.GIT_ACTIONS_PAT }}
        run: terraform plan -destroy -out=tfplan.bin -input=false -no-color -var-file="tfvars/${ENVIRONMENT}.tfvars"

      - name: Show destroy plan summary
        if: inputs.action == 'plan-destroy'
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          {
            echo "### Terraform Destroy Plan — scheduler (${ENVIRONMENT})"
            echo '```'
            terraform show -no-color tfplan.bin | tee tfplan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload destroy plan artefact
        if: inputs.action == 'plan-destroy'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tfplan-scheduler-${{ inputs.environment }}-destroy
          path: infra-live-scheduler/terraform/tfplan.txt
          retention-days: 7

      - name: Terraform Destroy
        if: inputs.action == 'destroy'
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          TF_VAR_github_pat: ${{ secrets.GIT_ACTIONS_PAT }}
        run: terraform apply -destroy -auto-approve -input=false -no-color -var-file="tfvars/${ENVIRONMENT}.tfvars"
