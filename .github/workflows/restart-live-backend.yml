name: Restart Live Backend
run-name: Restart Live Backend (${{ inputs.service }}, ${{ inputs.environment }}, ${{ inputs.aws_regions }})

on:
  workflow_dispatch:
    inputs:
      # Free text — see deploy-live-backend.yml's service input.
      service:
        description: "Services to restart: all, or a comma-separated list of: otel-collector, auth, auth-worker, users, users-worker, children, children-worker, onboarding, onboarding-worker, discover, discover-worker, grow, grow-worker, transform, transform-worker, release, release-worker, shared (e.g. users,users-worker). Restarted in parallel."
        required: true
        default: "all"
        type: string
      environment:
        description: "Deployment environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - sbx
          - stg
          - prod
      # Free text, checked against shared/routing.json's regions and turned into a
      # JSON array in the first job (TF-01): adding a region is one line in that file,
      # with no list of every combination to keep here.
      aws_regions:
        description: "AWS region(s), comma-separated, e.g. ap-south-1 or ap-south-1,eu-west-1 (supported: shared/routing.json's regions)"
        required: true
        type: string
        default: "ap-south-1"

permissions:
  id-token: write
  contents: read

# Locked per environment (not per service or region): one run at a time per
# environment across deploy, promote and restart, which share this namespace.
# Not per service: `service` is free text, so "all", "users" and
# "users-worker, users" would be different locks over the same ECS services.
concurrency:
  group: deploy-live-backend-superpower-${{ inputs.environment }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Checks the inputs before any environment's secrets are loaded (SEC-07), and turns the
  # typed regions into the JSON array the later jobs read (TF-01).
  validate:
    name: Validate Inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      regions: ${{ steps.check.outputs.regions }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check inputs
        id: check
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          REGIONS:     ${{ inputs.aws_regions }}
        run: |
          set -euo pipefail
          source scripts/workflow-inputs.sh
          check_environment "$ENVIRONMENT"
          echo "regions=$(regions_json "$REGIONS")" >> "$GITHUB_OUTPUT"

  # -------------------------------------------------------------------------
  # Turn inputs.service into the list of service names to restart, from the
  # ecs_services list in SSM (terraform-live-backend, services.tf) — so the
  # restart matrix below needs no edit when a service is added. Read from the
  # first selected region; each restart instance re-checks its own region.
  # -------------------------------------------------------------------------
  resolve:
    name: Resolve services
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    outputs:
      services: ${{ steps.list.outputs.services }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate required secrets and variables
        env:
          ROLE_ARN: ${{ vars.ROLE_ARN }}
          APP_NAME: ${{ vars.APP_NAME }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          missing=()
          [[ -z "$ROLE_ARN" ]] && missing+=("ROLE_ARN (variable)")
          [[ -z "$APP_NAME" ]] && missing+=("APP_NAME (variable)")
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "ERROR: Required GitHub environment secrets/variables are not set: ${missing[*]}"
            echo "Add them to the '${ENVIRONMENT}' GitHub environment and re-run."
            exit 1
          fi

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: ${{ vars.ROLE_ARN }}
          role-session-name: restart-live-backend-${{ inputs.environment }}
          aws-region: us-east-1

      - name: List services
        id: list
        env:
          FIRST_REGION: ${{ fromJson(needs.validate.outputs.regions)[0] }}
          SELECTION: ${{ inputs.service }}
          APP_NAME: ${{ vars.APP_NAME }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          source scripts/ecs-services.sh
          SERVICES=$(resolve_services "/${APP_NAME}/${ENVIRONMENT}/backend/$FIRST_REGION" "$SELECTION")
          echo "services=$(jq -c '[.[].name]' <<<"$SERVICES")" >> "$GITHUB_OUTPUT"
          echo "Restarting: $(jq -r '[.[].name] | join(", ")' <<<"$SERVICES")"

  restart:
    name: Restart Live Backend (${{ matrix.service }}, ${{ matrix.aws_region }})
    needs: [validate, resolve]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One parallel instance per selected region × service. fail-fast: false —
    # an in-flight rollout must never be cancelled just because another
    # instance failed.
    strategy:
      fail-fast: false
      matrix:
        aws_region: ${{ fromJson(needs.validate.outputs.regions) }}
        service: ${{ fromJson(needs.resolve.outputs.services) }}
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: ${{ vars.ROLE_ARN }}
          role-session-name: restart-live-backend-${{ inputs.environment }}
          aws-region: ${{ matrix.aws_region }}

      # -------------------------------------------------------------------------
      # Force a new deployment without changing the task definition: ECS
      # replaces the tasks with fresh ones on the current image (e.g. to pick
      # up rotated Secrets Manager values). The circuit breaker rolls back on
      # failure. Helpers: scripts/ecs-services.sh.
      # -------------------------------------------------------------------------
      - name: Force new deployment
        env:
          SSM_BASE: /${{ vars.APP_NAME }}/${{ inputs.environment }}/backend/${{ matrix.aws_region }}
          SERVICE_NAME: ${{ matrix.service }}
        run: |
          source scripts/ecs-services.sh

          CLUSTER=$(get_ssm "$SSM_BASE/ecs_cluster_name")
          if [ -z "$CLUSTER" ]; then
            echo "ERROR: ECS cluster name not found in SSM under $SSM_BASE. Run terraform-live-backend workflow (apply) first."
            exit 1
          fi
          SERVICE=$(resolve_services "$SSM_BASE" "$SERVICE_NAME" | jq -r '.[0].service')
          echo "Cluster: $CLUSTER"
          echo "Service ($SERVICE_NAME): $SERVICE"

          # No task definition: --force-new-deployment, then wait for that deployment.
          roll_out "$CLUSTER" "$SERVICE"
