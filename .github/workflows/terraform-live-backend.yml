name: Terraform Live Backend
run-name: Terraform Live Backend (${{ inputs.action }}, ${{ inputs.environment }}, ${{ inputs.aws_regions || inputs.aws_region }})

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action: plan, apply, plan-destroy, destroy"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
          - plan-destroy
          - destroy
      environment:
        description: "Deployment environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - sbx
          - stg
          - prod
      # workflow_dispatch has no native multi-select input, so every valid
      # non-empty combination of the 3 supported regions is enumerated below
      # as its own choice (same list as terraform-live-all.yml) — adding a 4th
      # region means hand-adding its combinations here too (2^n - 1 total).
      # Each selected region runs as its own parallel matrix instance.
      aws_regions:
        description: "AWS region(s) — each runs as a separate parallel job"
        required: true
        type: choice
        options:
          - '["ap-south-1"]'
          - '["eu-west-1"]'
          - '["us-east-1"]'
          - '["ap-south-1","eu-west-1"]'
          - '["ap-south-1","us-east-1"]'
          - '["eu-west-1","us-east-1"]'
          - '["ap-south-1","eu-west-1","us-east-1"]'
  workflow_call:
    inputs:
      action:
        type: string
        required: true
      environment:
        type: string
        required: true
      aws_region:
        type: string
        required: true

permissions:
  id-token: write
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  TF_VERSION: "1.16.4"
  TF_VAR_environment: ${{ inputs.environment }}

jobs:
  terraform:
    name: Terraform Live Backend ${{ inputs.action }} (${{ matrix.aws_region }})
    runs-on: ubuntu-latest
    # One parallel instance per selected region. fail-fast: false — an
    # in-flight apply in one region must never be cancelled just
    # because another region's instance failed.
    strategy:
      fail-fast: false
      matrix:
        aws_region: ${{ fromJson(inputs.aws_regions || format('["{0}"]', inputs.aws_region)) }}
    # Job-level (not workflow-level) so the lock stays per-region now that
    # one run can target several regions.
    concurrency:
      group: terraform-live-backend-superpower-${{ inputs.environment }}-${{ matrix.aws_region }}
      cancel-in-progress: false
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: infra-live-backend/terraform
    env:
      TF_IN_AUTOMATION: "1"
      TF_VAR_aws_region: ${{ matrix.aws_region }}
      # Resolved per GitHub environment, so dev/sbx/stg/prod each use their own values:
      # vars.* = environment variables (non-sensitive names, IDs, ARNs, public
      # keys), secrets.* = environment secrets (credentials only). See docs/ci-cd.md.
      TF_VAR_app_name:            ${{ vars.APP_NAME }}
      TF_VAR_mongodb_db_name:     ${{ vars.APP_NAME }}-${{ inputs.environment }}
      TF_VAR_domain_name:         ${{ vars.DOMAIN_NAME }}
      TF_VAR_hosted_zone_id:      ${{ vars.HOSTED_ZONE_ID }}
      TF_VAR_assets_bucket_name: ${{ vars.ASSETS_BUCKET_NAME }}
      TF_VAR_origin_verify_secret: ${{ secrets.ORIGIN_VERIFY_SECRET }}
      # Same kid → public key map the edge validates with (APP-02). Required:
      # the API service has no private key and verifies with these keys only.
      TF_VAR_jwt_public_keys: ${{ vars.JWT_PUBLIC_KEYS }}
      # The kid the auth service signs with. Must be the JWT_PUBLIC_KEYS entry
      # for JWT_PRIVATE_KEY — checked below, and auth refuses to start if not.
      TF_VAR_jwt_key_id: ${{ vars.JWT_KEY_ID || 'key-v1' }}
      # Optional — set only during an origin-verify rotation (the ALB then
      # accepts both values). See docs/infra-operations.md.
      TF_VAR_origin_verify_secret_next: ${{ secrets.ORIGIN_VERIFY_SECRET_NEXT }}
      # TF_VAR_acm_certificate_arn is resolved per-region in the
      # "Resolve ACM certificate ARN" step below and exported to GITHUB_ENV.
      # TF_VAR_subdomain_internal, TF_VAR_cookie_domain, and TF_VAR_cors_origins
      # are all derived from SUBDOMAIN + environment + DOMAIN_NAME in the
      # "Resolve derived values" step below and exported to GITHUB_ENV.

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      # -------------------------------------------------------------------------
      # Validate required secrets first — pure bash, no AWS calls needed —
      # so the workflow fails with a clear message before touching AWS if any
      # secret is missing, regardless of action (plan, apply, destroy, etc.).
      # At least one LLM key (OPENAI/ANTHROPIC/GEMINI_API_KEY) is required —
      # the backend refuses to start without one. A missing ANTHROPIC/GEMINI
      # key gets a REPLACE_ME placeholder from the Secrets Manager init step.
      # GOOGLE_CLIENT_ID (empty = Google Sign-In off) and OPS_EMAIL (needed only
      # when enable_ops_email = true — Terraform's own validation enforces
      # that) are optional, so they are not checked here.
      # -------------------------------------------------------------------------
      - name: Validate required secrets and variables
        env:
          ROLE_ARN:                            ${{ vars.ROLE_ARN }}
          APP_NAME:                            ${{ vars.APP_NAME }}
          STATE_BUCKET:                        ${{ vars.STATE_BUCKET }}
          SUBDOMAIN:                           ${{ vars.SUBDOMAIN }}
          DOMAIN_NAME:                         ${{ vars.DOMAIN_NAME }}
          HOSTED_ZONE_ID:                      ${{ vars.HOSTED_ZONE_ID }}
          ASSETS_BUCKET_NAME:                  ${{ vars.ASSETS_BUCKET_NAME }}
          JWT_PRIVATE_KEY:                     ${{ secrets.JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEYS:                     ${{ vars.JWT_PUBLIC_KEYS }}
          MONGODB_URI:                         ${{ secrets.MONGODB_URI }}
          OPENAI_API_KEY:                      ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY:                   ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY:                      ${{ secrets.GEMINI_API_KEY }}
          OPENAI_MODEL:                        ${{ vars.OPENAI_MODEL }}
          ANTHROPIC_MODEL:                     ${{ vars.ANTHROPIC_MODEL }}
          GEMINI_MODEL:                        ${{ vars.GEMINI_MODEL }}
          REDIS_AUTH_TOKEN:                    ${{ secrets.REDIS_AUTH_TOKEN }}
          ORIGIN_VERIFY_SECRET:                ${{ secrets.ORIGIN_VERIFY_SECRET }}
        run: |
          missing=()
          [[ -z "$ROLE_ARN"                       ]] && missing+=("ROLE_ARN (variable)")
          [[ -z "$APP_NAME"                       ]] && missing+=("APP_NAME (variable)")
          [[ -z "$STATE_BUCKET"                   ]] && missing+=("STATE_BUCKET (variable)")
          [[ -z "$SUBDOMAIN"                      ]] && missing+=("SUBDOMAIN (variable)")
          [[ -z "$DOMAIN_NAME"                    ]] && missing+=("DOMAIN_NAME (variable)")
          [[ -z "$HOSTED_ZONE_ID"                 ]] && missing+=("HOSTED_ZONE_ID (variable)")
          [[ -z "$ASSETS_BUCKET_NAME"             ]] && missing+=("ASSETS_BUCKET_NAME (variable)")
          [[ -z "$JWT_PRIVATE_KEY"                ]] && missing+=("JWT_PRIVATE_KEY")
          [[ -z "$JWT_PUBLIC_KEYS"                ]] && missing+=("JWT_PUBLIC_KEYS (variable)")
          [[ -z "$MONGODB_URI"                    ]] && missing+=("MONGODB_URI")
          [[ -z "$OPENAI_API_KEY$ANTHROPIC_API_KEY$GEMINI_API_KEY" ]] && missing+=("one of OPENAI_API_KEY/ANTHROPIC_API_KEY/GEMINI_API_KEY")
          [[ -z "$OPENAI_MODEL"                   ]] && missing+=("OPENAI_MODEL (variable)")
          [[ -z "$ANTHROPIC_MODEL"                ]] && missing+=("ANTHROPIC_MODEL (variable)")
          [[ -z "$GEMINI_MODEL"                   ]] && missing+=("GEMINI_MODEL (variable)")
          [[ -z "$REDIS_AUTH_TOKEN"               ]] && missing+=("REDIS_AUTH_TOKEN")
          [[ -z "$ORIGIN_VERIFY_SECRET"           ]] && missing+=("ORIGIN_VERIFY_SECRET")
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "ERROR: Required GitHub environment secrets/variables are not set: ${missing[*]}"
            echo "Add them to the '${{ inputs.environment }}' GitHub environment and re-run."
            exit 1
          fi

      # The API verifies with JWT_PUBLIC_KEYS only (auth/API split), so a wrong
      # or missing entry for the signing kid means every request is a 401 —
      # catch it here rather than after the rollout. Compares DER, so PEM
      # line wrapping and literal \n escapes don't matter.
      - name: Check JWT_PUBLIC_KEYS holds JWT_PRIVATE_KEY's public key
        env:
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEYS: ${{ vars.JWT_PUBLIC_KEYS }}
        run: |
          set -euo pipefail
          JWT_KEY_ID="$TF_VAR_jwt_key_id"
          if ! listed=$(jq -er --arg kid "$JWT_KEY_ID" '.[$kid] // empty' <<<"$JWT_PUBLIC_KEYS" 2>/dev/null); then
            echo "ERROR: JWT_PUBLIC_KEYS is not a JSON object with an entry for JWT_KEY_ID '$JWT_KEY_ID'. See docs/jwt-keys.md."
            exit 1
          fi
          # %b turns literal \n escapes (single-line secrets) into newlines.
          if ! derived=$(printf '%b' "$JWT_PRIVATE_KEY" | openssl pkey -pubout -outform DER 2>/dev/null | sha256sum) ||
             ! given=$(printf '%b' "$listed" | openssl pkey -pubin -outform DER 2>/dev/null | sha256sum); then
            echo "ERROR: JWT_PRIVATE_KEY or JWT_PUBLIC_KEYS['$JWT_KEY_ID'] is not a valid PEM key. See docs/jwt-keys.md."
            exit 1
          fi
          if [[ "$derived" != "$given" ]]; then
            echo "ERROR: JWT_PUBLIC_KEYS['$JWT_KEY_ID'] is not JWT_PRIVATE_KEY's public key — the API would reject every token auth issues. See docs/jwt-keys.md."
            exit 1
          fi
          echo "JWT_PUBLIC_KEYS['$JWT_KEY_ID'] matches JWT_PRIVATE_KEY."

      # Not an error — a rotation legitimately runs with it set for a while —
      # but a forgotten _NEXT leaves CloudFront sending it and every ALB
      # accepting two values indefinitely. See docs/infra-operations.md
      # "Rotating the origin-verify secret".
      - name: Warn if an origin-verify rotation is in progress
        if: env.TF_VAR_origin_verify_secret_next != ''
        run: |
          echo "::warning title=Origin-verify rotation in progress::ORIGIN_VERIFY_SECRET_NEXT is set for '${{ inputs.environment }}'. This ALB will accept it as well as ORIGIN_VERIFY_SECRET. Finish the rotation (promote it to ORIGIN_VERIFY_SECRET, delete _NEXT, re-apply the backend in every region) — see docs/infra-operations.md."

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          role-to-assume: ${{ vars.ROLE_ARN }}
          role-session-name: terraform-live-backend-${{ inputs.environment }}
          aws-region: ${{ matrix.aws_region }}

      # -------------------------------------------------------------------------
      # Per-region values (TF-01): three GitHub environment **variables**, each a
      # JSON map keyed by AWS region — they aren't secret, so variables (visible,
      # editable in the UI) are the right home. Adding a region is one more key
      # in each map; nothing in this workflow changes. e.g.
      #   ACM_CERTIFICATE_ARNS          {"ap-south-1": "arn:aws:acm:ap-south-1:…", …}
      #   UPLOADS_BUCKET_NAMES          {"ap-south-1": "superpower-uploads-…", …}
      #   REGIONAL_LOGGING_BUCKET_NAMES {"ap-south-1": "superpower-logs-…", …}
      # REGIONAL_LOGGING_BUCKET_NAMES needs an entry for every region in every
      # environment; whether the bucket is actually used is up to tfvars
      # (enable_cloudtrail / enable_alb_access_logs). See docs/ci-cd.md.
      # -------------------------------------------------------------------------
      - name: Resolve region-specific values
        env:
          REGION:                        ${{ matrix.aws_region }}
          ACM_CERTIFICATE_ARNS:          ${{ vars.ACM_CERTIFICATE_ARNS }}
          UPLOADS_BUCKET_NAMES:          ${{ vars.UPLOADS_BUCKET_NAMES }}
          REGIONAL_LOGGING_BUCKET_NAMES: ${{ vars.REGIONAL_LOGGING_BUCKET_NAMES }}
        run: |
          # lookup NAME JSON → the non-empty string at JSON[REGION], or an error
          # naming the variable and region.
          lookup() {
            local value
            if ! value=$(jq -er --arg r "$REGION" '.[$r] | select(type == "string" and length > 0)' <<<"${2:-}" 2>/dev/null); then
              echo "ERROR: GitHub environment variable $1 has no entry for '$REGION' (or isn't a JSON object)." >&2
              echo "Set it in the '${{ inputs.environment }}' environment, e.g. {\"$REGION\": \"…\"} — see docs/ci-cd.md." >&2
              return 1
            fi
            printf '%s' "$value"
          }
          acm=$(lookup ACM_CERTIFICATE_ARNS "$ACM_CERTIFICATE_ARNS") || exit 1
          uploads=$(lookup UPLOADS_BUCKET_NAMES "$UPLOADS_BUCKET_NAMES") || exit 1
          logging=$(lookup REGIONAL_LOGGING_BUCKET_NAMES "$REGIONAL_LOGGING_BUCKET_NAMES") || exit 1
          {
            echo "TF_VAR_acm_certificate_arn=$acm"
            echo "TF_VAR_uploads_bucket_name=$uploads"
            echo "TF_VAR_regional_logging_bucket_name=$logging"
          } >> "$GITHUB_ENV"

      # -------------------------------------------------------------------------
      # Several values are derived from SUBDOMAIN + environment + DOMAIN_NAME
      # using the same prod/non-prod FQDN logic as local.fqdn in infra-live-edge:
      #   prod     → {subdomain}.{domain_name}
      #   non-prod → {subdomain}-{environment}.{domain_name}
      #
      # subdomain_internal  — internal ALB prefix: SUBDOMAIN + "-internal"
      # cookie_domain       — public CloudFront FQDN (browser cookie scope)
      # cors_origins        — allowed browser origin: https://{fqdn}
      #
      # None of these need to be maintained as separate GitHub secrets or variables.
      # -------------------------------------------------------------------------
      - name: Resolve derived values
        env:
          SUBDOMAIN:   ${{ vars.SUBDOMAIN }}
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
        run: |
          echo "TF_VAR_subdomain_internal=${SUBDOMAIN}-internal" >> "$GITHUB_ENV"
          if [[ "${{ inputs.environment }}" == "prod" ]]; then
            FQDN="${SUBDOMAIN}.${DOMAIN_NAME}"
          else
            FQDN="${SUBDOMAIN}-${{ inputs.environment }}.${DOMAIN_NAME}"
          fi
          echo "TF_VAR_cookie_domain=${FQDN}"          >> "$GITHUB_ENV"
          echo "TF_VAR_cors_origins=https://${FQDN}"   >> "$GITHUB_ENV"

      # -------------------------------------------------------------------------
      # Export AI model identifiers from GitHub environment variables.
      # All three are required (validated above) — model names are non-sensitive
      # config that may differ per environment, so they live as variables rather
      # than tfvars to allow changes without a code commit.
      # -------------------------------------------------------------------------
      - name: Resolve model variables
        env:
          OPENAI_MODEL:    ${{ vars.OPENAI_MODEL }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          GEMINI_MODEL:    ${{ vars.GEMINI_MODEL }}
        run: |
          echo "TF_VAR_openai_model=$OPENAI_MODEL"       >> "$GITHUB_ENV"
          echo "TF_VAR_anthropic_model=$ANTHROPIC_MODEL" >> "$GITHUB_ENV"
          echo "TF_VAR_gemini_model=$GEMINI_MODEL"       >> "$GITHUB_ENV"

      - name: Resolve Redis auth token
        env:
          REDIS_AUTH_TOKEN: ${{ secrets.REDIS_AUTH_TOKEN }}
        run: |
          echo "TF_VAR_redis_auth_token=$REDIS_AUTH_TOKEN" >> "$GITHUB_ENV"


      # -------------------------------------------------------------------------
      # OPS_EMAIL is optional — if absent, no SNS email subscription is created
      # and alarm notifications go to the topic only (e.g. PagerDuty/Slack).
      # Set the secret per environment to receive alarm emails directly.
      # -------------------------------------------------------------------------
      - name: Resolve ops email
        env:
          OPS_EMAIL: ${{ vars.OPS_EMAIL }}
        run: |
          echo "TF_VAR_ops_email=${OPS_EMAIL:-}" >> "$GITHUB_ENV"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: |
          # -lockfile=readonly: use exactly the provider versions and hashes in
          # the committed .terraform.lock.hcl (TF-01). A provider upgrade is a
          # reviewed commit (terraform init -upgrade + providers lock), never a
          # silent change in CI.
          terraform init \
            -lockfile=readonly \
            -backend-config="bucket=${{ vars.STATE_BUCKET }}" \
            -backend-config="key=terraform-state-files/${{ vars.APP_NAME }}/${{ inputs.environment }}/backend/${{ matrix.aws_region }}/terraform.tfstate"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        if: inputs.action == 'plan' || inputs.action == 'apply'
        run: terraform plan -out=tfplan.bin -input=false -no-color -var-file=tfvars/${{ inputs.environment }}.tfvars

      - name: Show plan summary
        if: inputs.action == 'plan' || inputs.action == 'apply'
        run: |
          {
            echo "### Terraform Plan — backend / ${{ inputs.environment }} / ${{ matrix.aws_region }}"
            echo '```'
            terraform show -no-color tfplan.bin | tee tfplan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The redacted text plan, not tfplan.bin: a binary plan holds every
      # variable unredacted (Redis token, origin secret, GitHub PAT), and
      # artifacts are downloadable by anyone with read access to the repo.
      - name: Upload plan artefact
        if: inputs.action == 'plan' || inputs.action == 'apply'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tfplan-backend-${{ inputs.environment }}-${{ matrix.aws_region }}
          path: infra-live-backend/terraform/tfplan.txt
          retention-days: 7

      - name: Terraform Apply
        if: inputs.action == 'apply'
        run: terraform apply -auto-approve tfplan.bin

      # -------------------------------------------------------------------------
      # Initialise the Secrets Manager app secret on first apply only.
      # Reads the current secret and skips the update if all required keys already
      # contain real values (i.e. are not the REPLACE_ME placeholder written by
      # Terraform on resource creation). This prevents every apply from overwriting
      # secrets that were rotated manually outside of Terraform.
      # To update secrets after initial setup, use aws secretsmanager put-secret-value
      # directly, in every active backend region (see docs/infra-operations.md — Secrets Manager).
      # -------------------------------------------------------------------------
      - name: Initialise app secrets (first apply only)
        if: inputs.action == 'apply'
        env:
          JWT_PRIVATE_KEY:   ${{ secrets.JWT_PRIVATE_KEY }}
          GOOGLE_CLIENT_ID:  ${{ vars.GOOGLE_CLIENT_ID }}
          OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          MONGODB_URI:       ${{ secrets.MONGODB_URI }}
          REDIS_AUTH_TOKEN:  ${{ secrets.REDIS_AUTH_TOKEN }}
        run: |
          SECRET_ARN=$(terraform output -raw app_secret_arn)

          # Fetch current secret to check whether required keys are still placeholders
          CURRENT=$(aws secretsmanager get-secret-value \
            --secret-id "$SECRET_ARN" \
            --query SecretString \
            --output text 2>/dev/null || echo '{"JWT_PRIVATE_KEY":"REPLACE_ME"}')

          NEEDS_INIT=$(echo "$CURRENT" | jq -r '
            if (.JWT_PRIVATE_KEY == "REPLACE_ME") or
               (.GOOGLE_CLIENT_ID == "REPLACE_ME") or
               (.OPENAI_API_KEY == "REPLACE_ME") or
               (.MONGODB_URI == "REPLACE_ME") or
               (.REDIS_AUTH_TOKEN == "REPLACE_ME")
            then "true" else "false" end
          ')

          if [[ "$NEEDS_INIT" == "true" ]]; then
            echo "Placeholder values detected — initialising Secrets Manager..."
            aws secretsmanager put-secret-value \
              --secret-id "$SECRET_ARN" \
              --secret-string "$(jq -n \
                --arg jwt    "$JWT_PRIVATE_KEY" \
                --arg gid    "$GOOGLE_CLIENT_ID" \
                --arg openai "$OPENAI_API_KEY" \
                --arg anthro "${ANTHROPIC_API_KEY:-REPLACE_ME}" \
                --arg gemini "${GEMINI_API_KEY:-REPLACE_ME}" \
                --arg mongo  "$MONGODB_URI" \
                --arg redis  "$REDIS_AUTH_TOKEN" \
                '{JWT_PRIVATE_KEY: $jwt, GOOGLE_CLIENT_ID: $gid, OPENAI_API_KEY: $openai, ANTHROPIC_API_KEY: $anthro, GEMINI_API_KEY: $gemini, MONGODB_URI: $mongo, REDIS_AUTH_TOKEN: $redis}')"
            echo "App secrets initialised in Secrets Manager."
          else
            echo "Secrets Manager already contains real values — skipping automatic update. Rotate manually if needed."
          fi

      - name: Terraform Plan (destroy)
        if: inputs.action == 'plan-destroy' || inputs.action == 'destroy'
        run: terraform plan -destroy -out=tfplan.bin -input=false -no-color -var-file=tfvars/${{ inputs.environment }}.tfvars

      - name: Show destroy plan summary
        if: inputs.action == 'plan-destroy' || inputs.action == 'destroy'
        run: |
          {
            echo "### Terraform Destroy Plan — backend / ${{ inputs.environment }} / ${{ matrix.aws_region }}"
            echo '```'
            terraform show -no-color tfplan.bin | tee tfplan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload destroy plan artefact
        if: inputs.action == 'plan-destroy' || inputs.action == 'destroy'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tfplan-backend-destroy-${{ inputs.environment }}-${{ matrix.aws_region }}
          path: infra-live-backend/terraform/tfplan.txt
          retention-days: 7

      - name: Terraform Destroy
        if: inputs.action == 'destroy'
        run: terraform apply -auto-approve tfplan.bin
