name: Promote Live Backend
run-name: Promote Live Backend (${{ inputs.service }}, ${{ inputs.source_env }} → ${{ inputs.target_env }}, ${{ inputs.aws_regions }})

on:
  workflow_dispatch:
    inputs:
      # Free text — see deploy-live-backend.yml's service input.
      service:
        description: "Services to promote: all, or a comma-separated list of: auth, admin, backend, worker (e.g. backend,worker). Promoted in parallel."
        required: true
        default: "all"
        type: string
      source_env:
        description: "Source environment (image currently running here will be promoted)"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - sbx
          - stg
          - prod
      target_env:
        description: "Target environment (image will be deployed here)"
        required: true
        default: "stg"
        type: choice
        options:
          - dev
          - sbx
          - stg
          - prod
      # workflow_dispatch has no native multi-select input, so every valid
      # non-empty combination of the 3 supported regions is enumerated below
      # as its own choice (same list as terraform-live-all.yml) — adding a 4th
      # region means hand-adding its combinations here too (2^n - 1 total).
      # Each selected region runs as its own parallel matrix instance.
      aws_regions:
        description: "AWS region(s) — each runs as a separate parallel job"
        required: true
        type: choice
        options:
          - '["ap-south-1"]'
          - '["eu-west-1"]'
          - '["us-east-1"]'
          - '["ap-south-1","eu-west-1"]'
          - '["ap-south-1","us-east-1"]'
          - '["eu-west-1","us-east-1"]'
          - '["ap-south-1","eu-west-1","us-east-1"]'

permissions:
  id-token: write
  contents: read

# Locked per environment (not per service or region): one run at a time per
# environment across deploy, promote and restart, which share this namespace.
# Not per service: `service` is free text, so "all", "backend" and
# "worker, backend" would be different locks over the same ECS services.
concurrency:
  group: deploy-live-backend-superpower-${{ inputs.target_env }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # -------------------------------------------------------------------------
  # Validate runs first, before any environment secrets or variables are loaded, so bad
  # inputs are rejected up front.
  # -------------------------------------------------------------------------
  validate:
    name: Validate Promotion
    runs-on: ubuntu-latest
    steps:
      - name: Validate promotion direction
        run: |
          SOURCE="${{ inputs.source_env }}"
          TARGET="${{ inputs.target_env }}"

          if [ "$SOURCE" = "$TARGET" ]; then
            echo "::error::Source and target environments must differ."
            exit 1
          elif [ "$SOURCE" = "dev" ] && [ "$TARGET" = "sbx" ]; then
            echo "Promotion path: dev → sbx — OK"
          elif [ "$SOURCE" = "sbx" ] && [ "$TARGET" = "dev" ]; then
            echo "Promotion path: sbx → dev — OK"
          elif [ "$SOURCE" = "dev" ] && [ "$TARGET" = "stg" ]; then
            echo "Promotion path: dev → stg — OK"
          elif [ "$SOURCE" = "sbx" ] && [ "$TARGET" = "stg" ]; then
            echo "Promotion path: sbx → stg — OK"
          elif [ "$SOURCE" = "stg" ] && [ "$TARGET" = "prod" ]; then
            echo "Promotion path: stg → prod — OK"
          else
            echo "::error::Promotion from '$SOURCE' to '$TARGET' is not a permitted path. Allowed: dev↔sbx, dev→stg, sbx→stg, stg→prod."
            exit 1
          fi

  # -------------------------------------------------------------------------
  # export runs in the SOURCE environment (its own ROLE_ARN, so it works when
  # source and target are different AWS accounts — e.g. stg → prod). It reads
  # the image(s) currently live in the source ECS services, pulls them from
  # the source ECR, and hands them to the promote job as a short-lived
  # artifact. The target never references the source's ECR: the source repo
  # keeps only its last 30 images and may be destroyed nightly by the
  # scheduler, which would leave the target unable to pull on scale-out.
  # -------------------------------------------------------------------------
  export:
    name: Export Source Image (${{ matrix.aws_region }})
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        aws_region: ${{ fromJson(inputs.aws_regions) }}
    environment: ${{ inputs.source_env }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Validate required secrets and variables
        env:
          ROLE_ARN: ${{ vars.ROLE_ARN }}
          APP_NAME: ${{ vars.APP_NAME }}
        run: |
          missing=()
          [[ -z "$ROLE_ARN" ]] && missing+=("ROLE_ARN (variable)")
          [[ -z "$APP_NAME" ]] && missing+=("APP_NAME (variable)")
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "ERROR: Required GitHub environment secrets/variables are not set: ${missing[*]}"
            echo "Add them to the '${{ inputs.source_env }}' GitHub environment and re-run."
            exit 1
          fi

      # The source environment's deploy role: needs ssm:GetParameter,
      # ecs:DescribeServices/DescribeTaskDefinition and ECR pull on its own
      # resources — all of which the deploy workflow already uses.
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          role-to-assume: ${{ vars.ROLE_ARN }}
          role-session-name: promote-backend-export-${{ inputs.source_env }}
          aws-region: ${{ matrix.aws_region }}

      # -------------------------------------------------------------------------
      # Read the image each selected service is running RIGHT NOW in the
      # source (its PRIMARY deployment's task definition) — promote exactly
      # what is live, not a tag that was built but never reached steady state.
      # Services come from the source's ecs_services list (terraform-live-backend,
      # services.tf). Helpers: scripts/ecs-services.sh.
      # -------------------------------------------------------------------------
      - name: Read source images
        env:
          SSM_BASE: /${{ vars.APP_NAME }}/${{ inputs.source_env }}/backend/${{ matrix.aws_region }}
          SELECTION: ${{ inputs.service }}
        run: |
          source scripts/ecs-services.sh

          CLUSTER=$(get_ssm "$SSM_BASE/ecs_cluster_name")
          if [ -z "$CLUSTER" ]; then
            echo "ERROR: Source ECS cluster not found in SSM for env=${{ inputs.source_env }}. Run terraform-live-backend workflow (apply) for that environment first."
            exit 1
          fi
          SERVICES=$(resolve_services "$SSM_BASE" "$SELECTION")

          mkdir -p promote
          IMAGES='[]'
          while IFS= read -r ENTRY; do
            NAME=$(jq -r .name <<<"$ENTRY")
            IMAGE=$(live_image "$CLUSTER" "$(jq -r .service <<<"$ENTRY")" "$(jq -r .container <<<"$ENTRY")")
            if [[ "$IMAGE" == *@* ]]; then
              echo "ERROR: $NAME runs $IMAGE, pinned by digest; promote expects tag-based images (as deploy-live-backend pushes)."
              exit 1
            fi
            echo "Promoting $NAME: $IMAGE"
            IMAGES=$(jq -c --arg n "$NAME" --arg i "$IMAGE" '. + [{name: $n, image: $i}]' <<<"$IMAGES")
          done < <(jq -c '.[]' <<<"$SERVICES")
          echo "$IMAGES" > promote/images.json

      - name: Pull and save source images
        run: |
          mapfile -t IMAGES < <(jq -r '[.[].image] | unique | .[]' promote/images.json)
          REGISTRY="${IMAGES[0]%%/*}"   # <account>.dkr.ecr.<region>.amazonaws.com
          aws ecr get-login-password --region "${{ matrix.aws_region }}" \
            | docker login --username AWS --password-stdin "$REGISTRY"
          for REF in "${IMAGES[@]}"; do
            docker pull "$REF"
          done
          docker save "${IMAGES[@]}" | gzip -1 > promote/images.tar.gz
          cat promote/images.json

      - name: Upload source images
        uses: actions/upload-artifact@v7.0.1
        with:
          name: promote-backend-${{ matrix.aws_region }}
          path: promote/
          retention-days: 1
          # A "Re-run all jobs" uploads under the same name in the same run.
          overwrite: true

  # -------------------------------------------------------------------------
  # promote runs in the TARGET environment once export succeeds: it pushes
  # the exported image(s) into the target's own ECR (same tag), then rolls
  # the target ECS services onto them.
  # -------------------------------------------------------------------------
  promote:
    name: Promote Live Backend (${{ matrix.aws_region }})
    needs: export
    runs-on: ubuntu-latest
    # One parallel instance per selected region. fail-fast: false — an
    # in-flight rollout in one region must never be cancelled just
    # because another region's instance failed.
    strategy:
      fail-fast: false
      matrix:
        aws_region: ${{ fromJson(inputs.aws_regions) }}
    environment: ${{ inputs.target_env }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Validate required secrets and variables
        env:
          ROLE_ARN: ${{ vars.ROLE_ARN }}
          APP_NAME: ${{ vars.APP_NAME }}
        run: |
          missing=()
          [[ -z "$ROLE_ARN" ]] && missing+=("ROLE_ARN (variable)")
          [[ -z "$APP_NAME" ]] && missing+=("APP_NAME (variable)")
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "ERROR: Required GitHub environment secrets/variables are not set: ${missing[*]}"
            echo "Add them to the '${{ inputs.target_env }}' GitHub environment and re-run."
            exit 1
          fi

      # The target environment's deploy role — only target-environment
      # resources are touched from here on.
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          role-to-assume: ${{ vars.ROLE_ARN }}
          role-session-name: promote-backend-${{ inputs.source_env }}-to-${{ inputs.target_env }}
          aws-region: ${{ matrix.aws_region }}

      - name: Download source images
        uses: actions/download-artifact@v8.0.2
        with:
          name: promote-backend-${{ matrix.aws_region }}
          path: promote/

      # -------------------------------------------------------------------------
      # Push each exported image into the target's own ECR under its source
      # tag (IMMUTABLE tags: an existing tag is the identical image, so the push
      # is skipped), then roll every service onto it at once (as in
      # deploy-live-backend; a failure doesn't stop the others and fails the
      # step at the end, naming them). Only the image changes: env vars,
      # secrets refs, CPU/memory and logging come from the target's current
      # task definition, exactly as
      # Terraform set them for that environment. A service promoted from the
      # source must exist in the target too. Helpers: scripts/ecs-services.sh.
      # -------------------------------------------------------------------------
      - name: Promote services
        env:
          SSM_BASE: /${{ vars.APP_NAME }}/${{ inputs.target_env }}/backend/${{ matrix.aws_region }}
        run: |
          source scripts/ecs-services.sh

          CLUSTER=$(get_ssm "$SSM_BASE/ecs_cluster_name")
          REPO=$(get_ssm "$SSM_BASE/ecr_repository_url")
          if [ -z "$CLUSTER" ] || [ -z "$REPO" ]; then
            echo "ERROR: Target ECS cluster or ECR repository not found in SSM for env=${{ inputs.target_env }}. Run terraform-live-backend workflow (apply) for that environment first."
            exit 1
          fi
          SERVICES=$(resolve_services "$SSM_BASE" "$(jq -r '[.[].name] | join(",")' promote/images.json)")

          gunzip -c promote/images.tar.gz | docker load
          REGISTRY="${REPO%%/*}"    # <account>.dkr.ecr.<region>.amazonaws.com
          REPO_NAME="${REPO#*/}"    # strip registry host, keep <app>/<env>/backend
          aws ecr get-login-password --region "${{ matrix.aws_region }}" \
            | docker login --username AWS --password-stdin "$REGISTRY"

          while IFS= read -r SRC; do
            TAG="${SRC##*:}"
            if aws ecr describe-images --region "${{ matrix.aws_region }}" --repository-name "$REPO_NAME" \
                 --image-ids imageTag="$TAG" --output text &>/dev/null; then
              echo "$REPO:$TAG already exists in target ECR — skipping push."
            else
              docker tag "$SRC" "$REPO:$TAG"
              docker push "$REPO:$TAG"
              echo "Pushed: $REPO:$TAG"
            fi
          done < <(jq -r '[.[].image] | unique | .[]' promote/images.json)

          # The target-ECR copy of the image exported for this service.
          target_image() {
            local src
            src=$(jq -r --arg n "$(jq -r .name <<<"$1")" '.[] | select(.name == $n) | .image' promote/images.json)
            echo "$REPO:${src##*:}"
          }
          deploy_image "$CLUSTER" "$SERVICES" target_image
