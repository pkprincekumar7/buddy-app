name: Terraform Live Edge
run-name: "Terraform Live Edge (${{ inputs.action }}, ${{ inputs.environment }}, us-east-1, Backend regions: ${{ inputs.backend_regions }}, Bootstrap: ${{ inputs.bootstrap_region || 'auto' }})"

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action: plan, apply, plan-destroy, destroy"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
          - plan-destroy
          - destroy
      environment:
        description: "Deployment environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - sbx
          - stg
          - prod
      # Full rationale (kept here, not in description below, since the GitHub
      # UI renders that field as a single short helper line, not a paragraph):
      # this is the single source of truth for the module's region-aware
      # resources — the jwt_validator Lambda@Edge's location-based /api/*
      # routing AND which regions' uploads buckets get CloudFront
      # origins/behaviours (see infra-live-edge/terraform/variables.tf). Pick
      # the FULL set of every region that should stay active — Terraform is
      # declarative, so leaving out a previously-applied region here destroys
      # its edge config rather than preserving it. GitHub Actions
      # workflow_dispatch has no native multi-select input, so every valid
      # non-empty combination of the 3 supported regions is enumerated below
      # as its own choice — adding a 4th region means hand-adding its
      # combinations too (2^n - 1 total).
      backend_regions:
        description: "Pick the FULL set of active regions (not just the new one). Run 'plan' first to check for unintended deletions before 'apply'."
        required: true
        type: choice
        options:
          - '["ap-south-1"]'
          - '["eu-west-1"]'
          - '["us-east-1"]'
          - '["ap-south-1","eu-west-1"]'
          - '["ap-south-1","us-east-1"]'
          - '["eu-west-1","us-east-1"]'
          - '["ap-south-1","eu-west-1","us-east-1"]'
      # Which region's ALB serves login, Google sign-in, health and hint-less
      # register/refresh/logout (see infra-live-edge/terraform/variables.tf).
      # "auto" = first region in backend_regions (the original behaviour).
      # A named region must also be in backend_regions, or plan fails.
      bootstrap_region:
        description: "Region that serves login/health. 'auto' = first of backend_regions; a named region must be in backend_regions."
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - ap-south-1
          - eu-west-1
          - us-east-1
  workflow_call:
    inputs:
      action:
        type: string
        required: true
      environment:
        type: string
        required: true
      backend_regions:
        type: string
        required: true
      bootstrap_region:
        type: string
        required: false
        default: "auto"

permissions:
  id-token: write
  contents: read

# One run per environment at a time — deliberately does NOT include
# backend_regions. infra-live-edge is a single shared distribution/state per
# environment (not per-region), so two runs picking different region
# combinations for the same environment must never be allowed to run
# concurrently — they'd both mutate the same state file. Same reasoning as
# terraform-live-all.yml's concurrency group.
concurrency:
  group: terraform-live-edge-superpower-${{ inputs.environment }}-us-east-1
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  TF_VERSION: "1.16.4"
  TF_VAR_environment:     ${{ inputs.environment }}
  TF_VAR_backend_regions: ${{ inputs.backend_regions }}
  # || 'auto' covers any dispatch that omits the input entirely.
  TF_VAR_bootstrap_region: ${{ inputs.bootstrap_region || 'auto' }}

jobs:
  terraform:
    name: Terraform Live Edge ${{ inputs.action }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: infra-live-edge/terraform
    env:
      TF_IN_AUTOMATION: "1"
      # Resolved per GitHub environment, so dev/sbx/stg/prod each use their own values:
      # vars.* = environment variables (non-sensitive names, IDs, ARNs, public
      # keys), secrets.* = environment secrets (credentials only). See docs/ci-cd.md.
      TF_VAR_app_name:                      ${{ vars.APP_NAME }}
      TF_VAR_domain_name:                   ${{ vars.DOMAIN_NAME }}
      TF_VAR_subdomain:                     ${{ vars.SUBDOMAIN }}
      TF_VAR_hosted_zone_id:                ${{ vars.HOSTED_ZONE_ID }}
      # CloudFront's certificate is always in us-east-1: the us-east-1 entry of
      # the ACM_CERTIFICATE_ARNS variable (TF-01; the same certificate the
      # us-east-1 backend ALB uses, as before). '{}' → empty → caught below.
      TF_VAR_acm_certificate_arn_us_east_1: ${{ fromJSON(vars.ACM_CERTIFICATE_ARNS || '{}')['us-east-1'] }}
      TF_VAR_spa_bucket_name:          ${{ vars.SPA_BUCKET_NAME }}
      TF_VAR_assets_bucket_name:       ${{ vars.ASSETS_BUCKET_NAME }}
      TF_VAR_jwt_public_keys:          ${{ vars.JWT_PUBLIC_KEYS }}
      TF_VAR_origin_verify_secret:     ${{ secrets.ORIGIN_VERIFY_SECRET }}
      # Optional — set only during an origin-verify rotation; CloudFront then
      # sends it instead. See docs/infra-operations.md.
      TF_VAR_origin_verify_secret_next: ${{ secrets.ORIGIN_VERIFY_SECRET_NEXT }}
      TF_VAR_global_logging_bucket_name: ${{ vars.GLOBAL_LOGGING_BUCKET_NAME }}
      # TF_VAR_uploads_bucket_names is not set here — it is a JSON map built
      # from whichever regions are in inputs.backend_regions and written to
      # GITHUB_ENV by the "Resolve uploads bucket names" step below.

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Validate required secrets and variables
        env:
          ROLE_ARN:                      ${{ vars.ROLE_ARN }}
          APP_NAME:                      ${{ vars.APP_NAME }}
          STATE_BUCKET:                  ${{ vars.STATE_BUCKET }}
          DOMAIN_NAME:                   ${{ vars.DOMAIN_NAME }}
          SUBDOMAIN:                     ${{ vars.SUBDOMAIN }}
          HOSTED_ZONE_ID:                ${{ vars.HOSTED_ZONE_ID }}
          ACM_CERTIFICATE_ARN_US_EAST_1: ${{ fromJSON(vars.ACM_CERTIFICATE_ARNS || '{}')['us-east-1'] }}
          SPA_BUCKET_NAME:               ${{ vars.SPA_BUCKET_NAME }}
          ASSETS_BUCKET_NAME:            ${{ vars.ASSETS_BUCKET_NAME }}
          JWT_PUBLIC_KEYS:               ${{ vars.JWT_PUBLIC_KEYS }}
          GLOBAL_LOGGING_BUCKET_NAME:    ${{ vars.GLOBAL_LOGGING_BUCKET_NAME }}
          ORIGIN_VERIFY_SECRET:          ${{ secrets.ORIGIN_VERIFY_SECRET }}
        run: |
          missing=()
          [[ -z "$ROLE_ARN"                      ]] && missing+=("ROLE_ARN (variable)")
          [[ -z "$APP_NAME"                      ]] && missing+=("APP_NAME (variable)")
          [[ -z "$STATE_BUCKET"                  ]] && missing+=("STATE_BUCKET (variable)")
          [[ -z "$DOMAIN_NAME"                   ]] && missing+=("DOMAIN_NAME (variable)")
          [[ -z "$SUBDOMAIN"                     ]] && missing+=("SUBDOMAIN (variable)")
          [[ -z "$HOSTED_ZONE_ID"                ]] && missing+=("HOSTED_ZONE_ID (variable)")
          [[ -z "$ACM_CERTIFICATE_ARN_US_EAST_1" ]] && missing+=("ACM_CERTIFICATE_ARNS (variable) entry for us-east-1")
          [[ -z "$SPA_BUCKET_NAME"               ]] && missing+=("SPA_BUCKET_NAME (variable)")
          [[ -z "$ASSETS_BUCKET_NAME"            ]] && missing+=("ASSETS_BUCKET_NAME (variable)")
          # The UPLOADS_BUCKET_NAMES variable is checked per region in the
          # "Resolve uploads bucket names" step below, since which entries are
          # required depends on inputs.backend_regions.
          [[ -z "$JWT_PUBLIC_KEYS"               ]] && missing+=("JWT_PUBLIC_KEYS (variable)")
          [[ -z "$ORIGIN_VERIFY_SECRET"          ]] && missing+=("ORIGIN_VERIFY_SECRET")
          # GLOBAL_LOGGING_BUCKET_NAME required on prod (CloudTrail us-east-1 + WAF logging)
          if [[ "${{ inputs.environment }}" == "prod" && -z "$GLOBAL_LOGGING_BUCKET_NAME" ]]; then
            missing+=("GLOBAL_LOGGING_BUCKET_NAME (variable)")
          fi
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "ERROR: Required GitHub environment secrets/variables are not set: ${missing[*]}"
            echo "Add them to the '${{ inputs.environment }}' GitHub environment and re-run."
            exit 1
          fi

      # Not an error — a rotation legitimately runs with it set for a while —
      # but a forgotten _NEXT leaves CloudFront sending it and every ALB
      # accepting two values indefinitely. See docs/infra-operations.md
      # "Rotating the origin-verify secret".
      - name: Warn if an origin-verify rotation is in progress
        if: env.TF_VAR_origin_verify_secret_next != ''
        run: |
          echo "::warning title=Origin-verify rotation in progress::ORIGIN_VERIFY_SECRET_NEXT is set for '${{ inputs.environment }}'. CloudFront will send it instead of ORIGIN_VERIFY_SECRET — every backend region must already accept it. Finish the rotation (promote it to ORIGIN_VERIFY_SECRET, delete _NEXT, re-apply the backend in every region) — see docs/infra-operations.md."

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          role-to-assume: ${{ vars.ROLE_ARN }}
          role-session-name: terraform-live-edge-${{ inputs.environment }}
          aws-region: us-east-1

      # Builds TF_VAR_uploads_bucket_names — the UPLOADS_BUCKET_NAMES variable
      # (a JSON map keyed by region, TF-01) narrowed to inputs.backend_regions.
      # Matches infra-live-edge/terraform/variables.tf's uploads_bucket_names,
      # which validates it covers every active region. Adding a region is one
      # more key in the variable; nothing here changes.
      - name: Resolve uploads bucket names
        env:
          UPLOADS_BUCKET_NAMES: ${{ vars.UPLOADS_BUCKET_NAMES }}
          BACKEND_REGIONS:      ${{ inputs.backend_regions }}
        run: |
          if ! jq -e 'type == "object"' <<<"${UPLOADS_BUCKET_NAMES:-}" >/dev/null 2>&1; then
            echo "ERROR: GitHub environment variable UPLOADS_BUCKET_NAMES isn't set to a JSON object (e.g. {\"ap-south-1\": \"…\"}). See docs/ci-cd.md."
            exit 1
          fi
          missing=$(jq -rn --argjson regions "$BACKEND_REGIONS" --argjson names "$UPLOADS_BUCKET_NAMES" \
            '[$regions[] | select(($names[.] // "") | type != "string" or length == 0)] | join(", ")')
          if [[ -n "$missing" ]]; then
            echo "ERROR: UPLOADS_BUCKET_NAMES has no entry for: $missing. Add it in the '${{ inputs.environment }}' environment's variables."
            exit 1
          fi
          result=$(jq -cn --argjson regions "$BACKEND_REGIONS" --argjson names "$UPLOADS_BUCKET_NAMES" \
            '[$regions[] | {(.): $names[.]}] | add // {}')
          echo "TF_VAR_uploads_bucket_names=$result" >> "$GITHUB_ENV"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Verify SSM parameters exist and are readable
        id: ssm
        if: inputs.action == 'plan' || inputs.action == 'apply'
        run: |
          # A missing parameter fails apply. A plan instead skips the Terraform
          # plan with a notice: on a brand-new environment infra-live-backend
          # has only been planned, not applied, so there is nothing to read
          # yet (terraform-live-all's plan hits this on every fresh env).
          missing=0
          check_ssm() {
            local name="$1"
            local value
            if ! value=$(aws ssm get-parameter --region us-east-1 --name "$name" --query "Parameter.Value" --output text 2>&1); then
              echo "Cannot read SSM parameter '$name': $value"
              missing=1
              return 0
            fi
            echo "OK: $name"
          }
          APP="${{ vars.APP_NAME }}"
          ENV="${{ inputs.environment }}"

          # backend_regions (JSON array) drives the Lambda@Edge routing map —
          # every region listed there must also have this parameter, or the
          # Terraform plan fails later with a much less clear error.
          for region in $(echo '${{ inputs.backend_regions }}' | jq -r '.[]'); do
            check_ssm "/$APP/$ENV/backend/$region/alb_internal_fqdn"
          done

          if [[ "$missing" -eq 0 ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ inputs.action }}" == "plan" ]]; then
            echo "::notice::infra-live-backend is not applied for this environment yet — skipping the plan. Apply it first, then plan this stack."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: Ensure infra-live-backend has been applied and the IAM role has ssm:GetParameter on this path."
            exit 1
          fi

      - name: Terraform Init
        run: |
          # -lockfile=readonly: use exactly the provider versions and hashes in
          # the committed .terraform.lock.hcl (TF-01). A provider upgrade is a
          # reviewed commit (terraform init -upgrade + providers lock), never a
          # silent change in CI.
          terraform init \
            -lockfile=readonly \
            -backend-config="bucket=${{ vars.STATE_BUCKET }}" \
            -backend-config="key=terraform-state-files/${{ vars.APP_NAME }}/${{ inputs.environment }}/edge/us-east-1/terraform.tfstate"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        if: (inputs.action == 'plan' && steps.ssm.outputs.ready == 'true') || inputs.action == 'apply'
        run: terraform plan -out=tfplan.bin -input=false -no-color -var-file=tfvars/${{ inputs.environment }}.tfvars

      - name: Show plan summary
        if: (inputs.action == 'plan' && steps.ssm.outputs.ready == 'true') || inputs.action == 'apply'
        run: |
          {
            echo "### Terraform Plan — edge / ${{ inputs.environment }} / us-east-1 / Backend regions: ${{ inputs.backend_regions }} / Bootstrap: ${{ inputs.bootstrap_region || 'auto' }}"
            echo '```'
            terraform show -no-color tfplan.bin | tee tfplan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The redacted text plan, not tfplan.bin: a binary plan holds every
      # variable unredacted (Redis token, origin secret, GitHub PAT), and
      # artifacts are downloadable by anyone with read access to the repo.
      - name: Upload plan artefact
        if: (inputs.action == 'plan' && steps.ssm.outputs.ready == 'true') || inputs.action == 'apply'
        uses: actions/upload-artifact@v7.0.1
        with:
          # backend_regions is a JSON array (contains characters like " that
          # GitHub Actions artifact names disallow) — not included here; the
          # step summary above already records which regions this plan covers.
          name: tfplan-edge-${{ inputs.environment }}-us-east-1
          path: infra-live-edge/terraform/tfplan.txt
          retention-days: 7

      - name: Terraform Apply
        if: inputs.action == 'apply'
        run: terraform apply -auto-approve tfplan.bin

      - name: Terraform Plan (destroy)
        if: inputs.action == 'plan-destroy' || inputs.action == 'destroy'
        run: terraform plan -destroy -out=tfplan.bin -input=false -no-color -var-file=tfvars/${{ inputs.environment }}.tfvars

      - name: Show destroy plan summary
        if: inputs.action == 'plan-destroy' || inputs.action == 'destroy'
        run: |
          {
            echo "### Terraform Destroy Plan — edge / ${{ inputs.environment }} / us-east-1 / Backend regions: ${{ inputs.backend_regions }}"
            echo '```'
            terraform show -no-color tfplan.bin | tee tfplan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload destroy plan artefact
        if: inputs.action == 'plan-destroy' || inputs.action == 'destroy'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tfplan-edge-destroy-${{ inputs.environment }}-us-east-1
          path: infra-live-edge/terraform/tfplan.txt
          retention-days: 7

      - name: Terraform Destroy
        if: inputs.action == 'destroy'
        run: terraform apply -auto-approve tfplan.bin

      - name: Delete runtime SSM parameters
        if: inputs.action == 'destroy'
        run: |
          aws ssm delete-parameter \
            --region us-east-1 \
            --name "/${{ vars.APP_NAME }}/${{ inputs.environment }}/edge/deployed_git_sha" || true
