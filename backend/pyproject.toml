[build-system]
requires = ["setuptools"]
build-backend = "setuptools.backends.legacy:build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (undefined names, unused imports)
    "I",   # isort
    "B",   # flake8-bugbear (common bugs + opinionated style)
    "UP",  # pyupgrade (modernise syntax for py312)
    "C4",  # flake8-comprehensions (simplify comprehensions)
    "RET", # flake8-return (unnecessary else after return)
    "SIM", # flake8-simplify
    "N",   # pep8 naming
]
ignore = [
    "E501",   # line too long — enforced by ruff format, not ruff check
    "N818",   # exception class names (we use HTTPException which ends in Exception)
    "SIM108", # ternary operator suggestion — project uses them deliberately
    "B008",   # do not perform function calls in default arguments (FastAPI Depends pattern)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = false
warn_unused_ignores = true
warn_return_any = false
disallow_untyped_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live_service: needs a real MongoDB/Redis; skipped locally without one, but a skip fails the run when REQUIRE_LIVE_SERVICES=1 (CI)",
]

# Mutation testing (optional, not run in CI): pip install -r requirements-mutation.txt,
# then `mutmut run` from backend/ with a throwaway JWT_PRIVATE_KEY in the environment.
# Mutates the modules whose tests target 100% coverage, to check the tests would
# actually catch changes in behaviour — not just execute the lines.
[tool.mutmut]
source_paths = ["app"]
only_mutate = [
    "app/auth_utils.py",
    "app/database.py",
    "app/deps.py",
    "app/limiter.py",
    "app/llm_rate_limiter.py",
    "app/main.py",
    "app/routers/admin.py",
    "app/routers/audio.py",
]
also_copy = ["tools", "worker.py"]
pytest_add_cli_args_test_selection = ["tests"]
pytest_add_cli_args = ["-p", "no:warnings", "-q"]
