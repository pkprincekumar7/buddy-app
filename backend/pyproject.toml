[build-system]
requires = ["setuptools"]
build-backend = "setuptools.backends.legacy:build"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (undefined names, unused imports)
    "I",   # isort
    "B",   # flake8-bugbear (common bugs + opinionated style)
    "UP",  # pyupgrade (modernise syntax for py313)
    "C4",  # flake8-comprehensions (simplify comprehensions)
    "RET", # flake8-return (unnecessary else after return)
    "SIM", # flake8-simplify
    "N",   # pep8 naming
]
ignore = [
    "E501",   # line too long — enforced by ruff format, not ruff check
    "N818",   # exception class names (we use HTTPException which ends in Exception)
    "SIM108", # ternary operator suggestion — project uses them deliberately
    "B008",   # do not perform function calls in default arguments (FastAPI Depends pattern)
]

[tool.ruff.lint.isort]
known-first-party = ["common"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
strict = false
warn_unused_ignores = true
warn_return_any = false
disallow_untyped_defs = false
check_untyped_defs = true
# The tools are scripts that import each other as top-level modules; their tests import them
# as tools.*, which mypy would see as the same files under two names.
exclude = ["^tools/tests/"]

[tool.pytest.ini_options]
# Each service's own tests run per service, in its own install (tools/services.py).
testpaths = ["common/tests", "tools/tests"]
pythonpath = ["."]
markers = [
    "live_service: needs a real MongoDB/Redis; skipped locally without one, but a skip fails the run when REQUIRE_LIVE_SERVICES=1 (CI)",
]
# Third-party deprecations we can't fix here, each matched by message AND by the
# package that triggers it — so a deprecation from our own code still shows up.
# Drop an entry once that package's upgrade fixes it.
filterwarnings = [
    # botocore 1.35 calls datetime.utcnow() (deprecated in Python 3.12) when signing.
    "ignore:datetime.datetime.utcnow\\(\\) is deprecated:DeprecationWarning:botocore",
    # Starlette 1.x's TestClient (used via fastapi.testclient) on httpx.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
# Measure the code, not its tests (each package keeps its tests inside it).
omit = ["*/tests/*"]

# Import boundaries (docs/auth-users-split.md, section 2) are generated from the services
# in the tree, so there's no list to keep here: `python tools/import_contracts.py`.
