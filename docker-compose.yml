# Stack: MongoDB + Valkey + gateway + FastAPI (backend) + static UI served by nginx (frontend
# image). MongoDB and Valkey are the local stand-ins for Atlas and ElastiCache that the new
# services build on (docs/auth-users-split-build-plan.md, 0.3); automated tests use them too,
# never Atlas.
#
# SNS, SQS and S3 come from Moto. Run it from the backend venv (Docker Desktop's org policy
# blocks the motoserver/moto image here):
#   backend/.venv/bin/moto_server -H 0.0.0.0 -p 5050
# Containers reach it at http://host.docker.internal:5050. Where the image is allowed,
# `docker compose --profile moto up -d moto` runs the same server in a container instead.
# There is no separate "nginx" service: nginx runs inside the frontend container on port 80.
#
# UI: http://localhost:${FRONTEND_PORT:-5173} → nginx proxies /api/* to backend:8000
# API directly: http://localhost:${BACKEND_PORT:-8000}
#
# Project name: images and containers are named superpower-<service>(-1), not after the
# checkout folder (buddy-app).
name: superpower

services:
  # Single-node replica set: change streams and transactions need one (design 7.3, 9.3).
  # The member is registered as localhost:27017, so every client connects with
  # directConnection=true, from the host and from other containers alike.
  mongo:
    image: mongo:8.0.34
    command: ["--replSet", "rs0", "--bind_ip_all"]
    restart: unless-stopped
    networks:
      - superpower_net
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      # Initiates the replica set on first start, then reports healthy once it's primary.
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}).ok }; db.hello().isWritablePrimary || quit(1)",
        ]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  # Same engine and major version as prod's ElastiCache (Valkey 8.0). Where Docker's org policy
  # blocks valkey/valkey, set VALKEY_IMAGE=redis:7-alpine in .env: same protocol for what the
  # services use (GET/SET with expiry, Lua, SET NX, ACL users).
  valkey:
    image: ${VALKEY_IMAGE:-valkey/valkey:8.0.11-alpine}
    restart: unless-stopped
    networks:
      - superpower_net
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping 2>/dev/null || redis-cli ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Optional (profile "moto"): Moto in a container, for where the image is allowed. Otherwise
  # run moto_server from the backend venv, as above; same port, same API.
  moto:
    image: motoserver/moto:5.2.3
    profiles: ["moto"]
    restart: unless-stopped
    networks:
      - superpower_net
    ports:
      - "${MOTO_PORT:-5050}:5000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/moto-api/')",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # Local stand-in for the ALB's path rules (design 13.1): routes each /api/* path to its
  # service. Generated from shared/service-routes.json by scripts/sync-gateway.mjs. Until the
  # old backend is removed (build plan 8.6), paths no new service claims go to `backend`.
  gateway:
    image: nginx:1.31.6-alpine
    restart: unless-stopped
    networks:
      - superpower_net
    ports:
      - "${GATEWAY_PORT:-8088}:8080"
    volumes:
      - ./local/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/gateway/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/?directConnection=true}
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-superpower-local}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?JWT_PRIVATE_KEY is required - see .env.example for how to generate it}
      JWT_KEY_ID: ${JWT_KEY_ID:-key-v1}
      JWT_ACCESS_EXPIRE_MINUTES: ${JWT_ACCESS_EXPIRE_MINUTES:-30}
      JWT_REFRESH_EXPIRE_HOURS: ${JWT_REFRESH_EXPIRE_HOURS:-24}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3-flash}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      BEHIND_PROXY: ${BEHIND_PROXY:-true}
      APP_ENV: ${APP_ENV:-local}
      REDIS_URL: ${REDIS_URL:-redis://valkey:6379}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      LLM_HOURLY_LIMIT: ${LLM_HOURLY_LIMIT:-200}
      ASSETS_BUCKET_NAME: ${ASSETS_BUCKET_NAME:-}
      UPLOADS_BUCKET_NAME: ${UPLOADS_BUCKET_NAME:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      UPLOADS_URL_TTL_SECONDS: ${UPLOADS_URL_TTL_SECONDS:-3600}
    networks:
      - superpower_net
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      mongo:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 25s

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "worker.py"]
    restart: unless-stopped
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/?directConnection=true}
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-superpower-local}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?JWT_PRIVATE_KEY is required - see .env.example for how to generate it}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3-flash}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      APP_ENV: ${APP_ENV:-local}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-5}
      AWS_REGION: ${AWS_REGION:-}
    networks:
      - superpower_net
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    networks:
      - superpower_net
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    environment:
      ASSETS_BUCKET_NAME: ${ASSETS_BUCKET_NAME:-}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  mongo_data:
    name: superpower_mongo_data
  valkey_data:
    name: superpower_valkey_data

networks:
  superpower_net:
    name: superpower_net
